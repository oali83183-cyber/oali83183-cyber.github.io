<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>علي — التمرين والتغذية 🏐</title>
<style>
  :root{--bg:#0e0e10;--card:#1c1c20;--card2:#25252c;--line:#2f2f37;--txt:#f5f5f7;--sub:#9aa0a6;--ok:#1fd07c;--accent:#e11d2d;--gold:#ffdf6b;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,Tahoma,sans-serif;font-size:15px;line-height:1.6;}
  .app{max-width:560px;margin:0 auto;padding:12px 10px 50px;}
  .top{text-align:center;margin-bottom:10px;}
  .top .day{font-size:19px;font-weight:900;}
  .top .date{color:var(--sub);font-size:12.5px;}
  .tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px;}
  .tab{border:none;border-radius:12px;padding:12px;font-size:15px;font-weight:900;cursor:pointer;font-family:inherit;background:var(--card);border:1px solid var(--line);color:var(--sub);}
  .tab.active{background:var(--accent);color:#fff;border-color:var(--accent);}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px;}
  .card h2{margin:0 0 6px;font-size:15.5px;}
  .muted{color:var(--sub);font-size:12px;}
  .ex{display:flex;align-items:center;gap:9px;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:9px 10px;margin-bottom:7px;}
  .ex input{width:21px;height:21px;accent-color:var(--ok);flex-shrink:0;}
  .ex .nm{flex:1;font-weight:700;font-size:13.5px;}
  .ex .st{color:var(--gold);font-weight:800;white-space:nowrap;font-size:12px;}
  .ex.done{opacity:.5;} .ex.done .nm{text-decoration:line-through;}
  .vidrow{display:flex;gap:5px;flex-wrap:wrap;margin:3px 0 9px 22px;}
  .vbtn{border:none;color:#fff;border-radius:8px;padding:6px 11px;font-size:11.5px;font-weight:700;cursor:pointer;font-family:inherit;}
  .pbar{height:8px;background:var(--card2);border-radius:99px;overflow:hidden;margin-top:5px;}
  .pbar div{height:100%;background:var(--ok);border-radius:99px;transition:width .3s;}
  .plabel{font-size:12px;color:var(--sub);text-align:center;margin-top:3px;}
  .habit{display:flex;align-items:center;gap:9px;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:9px 10px;margin-bottom:6px;}
  .habit input{width:19px;height:19px;accent-color:var(--ok);}
  .habit .nm{flex:1;font-weight:700;font-size:13px;}
  .habit.done{opacity:.5;} .habit.done .nm{text-decoration:line-through;}
  .toplog{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px;}
  .toplog .tf{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:5px 3px;text-align:center;}
  .toplog label{display:block;font-size:9.5px;color:var(--sub);margin-bottom:2px;font-weight:700;}
  .toplog input{width:100%;background:var(--card2);border:1px solid var(--line);color:var(--txt);border-radius:7px;padding:5px 2px;font-size:14px;font-family:inherit;text-align:center;}
  .alt{font-size:11.5px;color:var(--sub);margin:-1px 0 7px 20px;line-height:1.5;}
  .alt b{color:var(--gold);}
  .exbox{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 10px;margin-bottom:8px;}
  .exname{background:transparent;border:none;color:var(--txt);text-align:right;cursor:pointer;padding:0;font-family:inherit;}
  .exname:after{content:" 💡";opacity:.6;}
  .exinfo{font-size:12.5px;color:var(--sub);background:var(--card2);border:1px dashed var(--line);border-radius:8px;padding:8px 10px;margin:6px 0;line-height:1.7;}
  .bigbtn{display:block;width:100%;border:none;border-radius:13px;padding:13px;font-size:14.5px;font-weight:900;cursor:pointer;font-family:inherit;background:var(--accent);color:#fff;}
  .bigbtn.green{background:var(--ok);color:#06210f;}
  .note{background:#1e1a0a;border:1px solid #6b5900;color:var(--gold);border-radius:10px;padding:8px 10px;font-size:11.5px;margin-bottom:10px;}
  .mini{font-size:11px;color:var(--sub);text-align:center;margin-top:7px;}
  .sess-head{display:flex;align-items:center;gap:8px;margin:12px 0 7px;}
  .sess-head .ic{font-size:20px;}
  .sess-head b{font-size:15px;}
  .sess-head .tag{background:var(--card2);border:1px solid var(--line);color:var(--sub);border-radius:20px;padding:2px 9px;font-size:10.5px;}
  .foodrow{display:flex;align-items:center;gap:9px;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:9px 10px;margin-bottom:7px;}
  .foodrow input{width:19px;height:19px;accent-color:var(--ok);flex-shrink:0;}
  .foodrow .ft{flex:1;}
  .foodrow .ft b{display:block;font-size:13px;}
  .foodrow .ft span{color:var(--sub);font-size:11.5px;}
  .foodrow .fc{color:var(--sub);font-size:11px;white-space:nowrap;text-align:left;}
  .grocery{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
  .grocery .gi{background:var(--card2);border:1px solid var(--line);border-radius:9px;padding:7px 9px;font-size:11.5px;color:var(--sub);}
  .grocery .gi b{color:var(--txt);display:block;font-size:12px;}
  .section-title{margin:12px 0 6px;font-size:13.5px;font-weight:900;color:var(--gold);}
</style>
</head>
<body>

    <div class="day" id="dayTitle">📅</div>

  </div>

    <button class="tab active" id="tabTrain" onclick="showTab('train')">🏋️ التمرين</button>
    <button class="tab" id="tabFood" onclick="showTab('food')">🍽️ الأكل</button>

  <div id="trainBox"></div>
  <div id="foodBox" style="display:none;"></div>
</div>

/* ===== تخزين ===== */
var KEY="ali_best_v1";
function loadDB(){
  var def={am:{},pm:{},fixed:{},food:{}};
  try{var raw=localStorage.getItem(KEY);if(!raw)return def;var p=JSON.parse(raw);if(!p||typeof p!=="object")return def;for(var k in def){if(!p[k])p[k]=def[k];}return p;}catch(e){return def;}
}
var DB=loadDB();
function saveDB(){try{localStorage.setItem(KEY,JSON.stringify(DB));}catch(e){}}

/* ===== فيديو ===== */
function vidRow(name){
  var q=VID[name]||name;
  var r=document.createElement("div");r.className="vidrow";
  [["▶️ يوتيوب","#e11d2d","https://www.youtube.com/results?search_query="],
   ["🎵 تيك توك","#111827","https://www.tiktok.com/search?q="],
   ["📸 انستا","#8a3ab9","https://www.instagram.com/explore/search/keyword/?q="]].forEach(function(x){
    var b=document.createElement("button");b.className="vbtn";b.style.background=x[1];
    b.textContent=x[0];b.onclick=function(){window.open(x[2]+encodeURIComponent(q),"_blank");};
    r.appendChild(b);
  });
  return r;
}

function showTab(t){
  document.getElementById("tabTrain").classList.toggle("active",t==="train");
  document.getElementById("tabFood").classList.toggle("active",t==="food");
  document.getElementById("trainBox").style.display=t==="train"?"block":"none";
  document.getElementById("foodBox").style.display=t==="food"?"block":"none";
}

/* ===== عرض التمرين (صباح + مساء) ===== */
function renderTrain(){
  var now=new Date();
  var di=now.getDay();
  var s=SCHED[di];
  var k=todayKey();
  var box=document.getElementById("trainBox");
  document.getElementById("dayTitle").textContent=s.day+" — "+s.title;
  document.getElementById("dateSub").textContent=fmtDate(now)+" | "+s.cal;

  box.innerHTML="";

  /* خانات علوية */
  var tl=document.createElement("div");tl.className="toplog";
  tl.innerHTML="<div class='tf'><label>⚖️ الوزن</label><input id='qw' type='number' step='0.1'></div>"+
    "<div class='tf'><label>😴 النوم</label><input id='qs' type='number' step='0.5'></div>"+
    "<div class='tf'><label>💧 ماء</label><input id='qwt' type='number' step='0.5'></div>"+
    "<div class='tf'><label>💪 بروتين</label><input id='qp' type='number'></div>";
  box.appendChild(tl);

  box.insertAdjacentHTML("beforeend",'<div class="note">🚫 ممنوع جري طويل • قفز على نجيل/بساط فقط • RIR 2-3 (لا فشل) • بروتين 215جم • ماء 4لتر • 10k خطوة • كرياتين 5جم • نوم 8 ساعات</div>');

  /* ثابت كل يوم */
  var farr=DB.fixed[k]||[false,false];
  var hab=document.createElement("div");hab.className="card";
  hab.innerHTML="<h2>📌 ثابت كل يوم</h2>";
  ["💊 كرياتين 5جم","👣 10,000 خطوة"].forEach(function(h,i){
    var row=document.createElement("div");row.className="habit";
    var cb=document.createElement("input");cb.type="checkbox";cb.checked=!!farr[i];
    cb.onchange=function(){farr[i]=cb.checked;DB.fixed[k]=farr;saveDB();row.classList.toggle("done",cb.checked);};
    if(cb.checked)row.classList.add("done");
    var sp=document.createElement("span");sp.className="nm";sp.textContent=h;
    row.appendChild(cb);row.appendChild(sp);
    hab.appendChild(row);
  });
  box.appendChild(hab);

  /* دالة بناء حصة (صباح/مساء) */
  function buildSession(slotId,title,icon,tag,groups){
    var head=document.createElement("div");head.className="sess-head";
    head.innerHTML="<span class='ic'>"+icon+"</span><b>"+esc(title)+"</b><span class='tag'>"+esc(tag)+"</span>";
    box.appendChild(head);
    var arr=DB[slotId][k]||[];
    var card=document.createElement("div");card.className="card";
    var list=document.createElement("div");
    var total=0;
    groups.forEach(function(grp){
      grp.ex.forEach(function(ex){total++;});
      // عنوان المجموعة
      var gHead=document.createElement("div");gHead.className="section-title";
      gHead.textContent=grp.cat;
      list.appendChild(gHead);
      grp.ex.forEach(function(ex,i){
        var idx=total-grp.ex.length+i;
        // بطاقة مستقلة لكل تمرين
        var box2=document.createElement("div");box2.className="exbox";
        var row=document.createElement("div");row.className="ex";
        var cb=document.createElement("input");cb.type="checkbox";cb.checked=!!arr[idx];
        cb.onchange=function(){arr[idx]=cb.checked;DB[slotId][k]=arr;saveDB();row.classList.toggle("done",cb.checked);updateP();};
        if(cb.checked)row.classList.add("done");
        // اسم التمرين — قابل للنقر لفتح الشرح
        var nm=document.createElement("button");nm.className="nm exname";
        nm.type="button";nm.textContent=ex[0];
        var st=document.createElement("span");st.className="st";st.textContent=ex[1];
        row.appendChild(cb);row.appendChild(nm);row.appendChild(st);
        box2.appendChild(row);
        // شرح التمرين (يظهر عند النقر)
        var info=document.createElement("div");info.className="exinfo";
        info.style.display="none";
        var how=EXPLAIN[ex[0]];
        if(how){
          info.innerHTML="📌 <b>"+esc(ex[0])+":</b> "+esc(how);
          nm.onclick=function(){info.style.display=(info.style.display==="none")?"block":"none";};
        }else{
          info.innerHTML="📌 " + esc(ex[0]);
          nm.onclick=function(){info.style.display=(info.style.display==="none")?"block":"none";};
        }
        box2.appendChild(info);
        if(ALT[ex[0]]){var alt=document.createElement("div");alt.className="alt";alt.innerHTML="🔄 <b>بديل:</b> "+esc(ALT[ex[0]]);box2.appendChild(alt);}
        box2.appendChild(vidRow(ex[0]));
        list.appendChild(box2);
      });
    });
    card.appendChild(list);
    var bar=document.createElement("div");bar.className="pbar";
    var fill=document.createElement("div");fill.style.width="0%";bar.appendChild(fill);
    card.appendChild(bar);
    var lbl=document.createElement("div");lbl.className="plabel";lbl.id="plbl_"+slotId;
    card.appendChild(lbl);
    box.appendChild(card);
    window["_f_"+slotId]=fill;window["_a_"+slotId]=arr;window["_n_"+slotId]=total;
    function updateP(){var dn=(window["_a_"+slotId]||[]).filter(Boolean).length;window["_f_"+slotId].style.width=(dn/total*100)+"%";var l=document.getElementById("plbl_"+slotId);if(l)l.textContent="أنجزت "+dn+" من "+total;}
    updateP();
  }

  buildSession("am","صباح 60 د — في البيت/الملعب","☀️","كرة + جلد",s.am);
  buildSession("pm","مساء 60 د — في النادي","🌙","نادي كامل",s.pm);

  /* زر نسخ التقرير */
  var qc=document.createElement("div");qc.className="card";
  var bCopy=document.createElement("button");bCopy.className="bigbtn";bCopy.textContent="📤 انسخ تقرير اليوم وأرسله للمدرب";
  bCopy.onclick=copyReport;
  qc.appendChild(bCopy);
  box.appendChild(qc);
}

function copyReport(){
  var k=todayKey();
  var now=new Date();
  var s=SCHED[now.getDay()];
  var amArr=DB.am[k]||[],pmArr=DB.pm[k]||[];
  var g=function(id){var e=document.getElementById(id);return e&&e.value?e.value:"—";};
  var lines=[];
  lines.push("📅 يومي — "+AR_DAYS[now.getDay()]+" "+fmtDate(now)+" | "+s.title);
  lines.push("☀️ صباح: "+amArr.filter(Boolean).length+"/"+s.am.length+" | 🌙 مساء: "+pmArr.filter(Boolean).length+"/"+s.pm.length);
  lines.push("⚖️ الوزن: "+g("qw")+" | 😴 النوم: "+g("qs")+" | 💧 ماء: "+g("qwt")+"ل | 💪 بروتين: "+g("qp")+"جم");
  lines.push("📌 ثابت: "+((DB.fixed[k]||[]).filter(Boolean).length)+"/2 | 🍽️ أكل: "+((DB.food[k]||[]).filter(Boolean).length)+"/4");
  var txt=lines.join("\n");
  try{
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(function(){alert("تم النسخ ✅ — الصقه في المحادثة مع مدربك");});}
    else{fallbackCopy(txt);}
  }catch(e){fallbackCopy(txt);}
}
function fallbackCopy(txt){
  var ta=document.createElement("textarea");ta.value=txt;ta.style.position="fixed";ta.style.opacity="0";
  document.body.appendChild(ta);ta.select();
  try{document.execCommand("copy");alert("تم النسخ ✅ — الصقه في المحادثة مع مدربك");}catch(e){alert("انسخ يدوياً:\n"+txt);}
  document.body.removeChild(ta);
}
