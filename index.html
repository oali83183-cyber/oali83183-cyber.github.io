<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>علي — التمرين والتغذية 🏐</title>
<style>
  :root{--bg:#0e0e10;--card:#1c1c20;--card2:#25252c;--line:#2f2f37;--txt:#f5f5f7;--sub:#9aa0a6;--ok:#1fd07c;--accent:#e11d2d;--gold:#ffdf6b;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,Tahoma,sans-serif;font-size:15px;line-height:1.6;}
  .app{max-width:560px;margin:0 auto;padding:12px 10px 50px;}
  .top{text-align:center;margin-bottom:10px;}
  .top .day{font-size:19px;font-weight:900;}
  .top .date{color:var(--sub);font-size:12.5px;}
  .tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px;}
  .tab{border:none;border-radius:12px;padding:12px;font-size:15px;font-weight:900;cursor:pointer;font-family:inherit;background:var(--card);border:1px solid var(--line);color:var(--sub);}
  .tab.active{background:var(--accent);color:#fff;border-color:var(--accent);}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px;}
  .card h2{margin:0 0 6px;font-size:15.5px;}
  .muted{color:var(--sub);font-size:12px;}
  .ex{display:flex;align-items:center;gap:9px;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:9px 10px;margin-bottom:7px;}
  .ex input{width:21px;height:21px;accent-color:var(--ok);flex-shrink:0;}
  .ex .nm{flex:1;font-weight:700;font-size:13.5px;}
  .ex .st{color:var(--gold);font-weight:800;white-space:nowrap;font-size:12px;}
  .ex.done{opacity:.5;} .ex.done .nm{text-decoration:line-through;}
  .vidrow{display:flex;gap:5px;flex-wrap:wrap;margin:3px 0 9px 22px;}
  .vbtn{border:none;color:#fff;border-radius:8px;padding:6px 11px;font-size:11.5px;font-weight:700;cursor:pointer;font-family:inherit;}
  .pbar{height:8px;background:var(--card2);border-radius:99px;overflow:hidden;margin-top:5px;}
  .pbar div{height:100%;background:var(--ok);border-radius:99px;transition:width .3s;}
  .plabel{font-size:12px;color:var(--sub);text-align:center;margin-top:3px;}
  .habit{display:flex;align-items:center;gap:9px;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:9px 10px;margin-bottom:6px;}
  .habit input{width:19px;height:19px;accent-color:var(--ok);}
  .habit .nm{flex:1;font-weight:700;font-size:13px;}
  .habit.done{opacity:.5;} .habit.done .nm{text-decoration:line-through;}
  .toplog{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px;}
  .toplog .tf{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:5px 3px;text-align:center;}
  .toplog label{display:block;font-size:9.5px;color:var(--sub);margin-bottom:2px;font-weight:700;}
  .toplog input{width:100%;background:var(--card2);border:1px solid var(--line);color:var(--txt);border-radius:7px;padding:5px 2px;font-size:14px;font-family:inherit;text-align:center;}
  .alt{font-size:11.5px;color:var(--sub);margin:-1px 0 7px 20px;line-height:1.5;}
  .alt b{color:var(--gold);}
  .exbox{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 10px;margin-bottom:8px;}
  .exname{background:transparent;border:none;color:var(--txt);text-align:right;cursor:pointer;padding:0;font-family:inherit;}
  .exname:after{content:" 💡";opacity:.6;}
  .exinfo{font-size:12.5px;color:var(--sub);background:var(--card2);border:1px dashed var(--line);border-radius:8px;padding:8px 10px;margin:6px 0;line-height:1.7;}
  .bigbtn{display:block;width:100%;border:none;border-radius:13px;padding:13px;font-size:14.5px;font-weight:900;cursor:pointer;font-family:inherit;background:var(--accent);color:#fff;}
  .bigbtn.green{background:var(--ok);color:#06210f;}
  .note{background:#1e1a0a;border:1px solid #6b5900;color:var(--gold);border-radius:10px;padding:8px 10px;font-size:11.5px;margin-bottom:10px;}
  .mini{font-size:11px;color:var(--sub);text-align:center;margin-top:7px;}
  .sess-head{display:flex;align-items:center;gap:8px;margin:12px 0 7px;}
  .sess-head .ic{font-size:20px;}
  .sess-head b{font-size:15px;}
  .sess-head .tag{background:var(--card2);border:1px solid var(--line);color:var(--sub);border-radius:20px;padding:2px 9px;font-size:10.5px;}
  .foodrow{display:flex;align-items:center;gap:9px;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:9px 10px;margin-bottom:7px;}
  .foodrow input{width:19px;height:19px;accent-color:var(--ok);flex-shrink:0;}
  .foodrow .ft{flex:1;}
  .foodrow .ft b{display:block;font-size:13px;}
  .foodrow .ft span{color:var(--sub);font-size:11.5px;}
  .foodrow .fc{color:var(--sub);font-size:11px;white-space:nowrap;text-align:left;}
  .grocery{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
  .grocery .gi{background:var(--card2);border:1px solid var(--line);border-radius:9px;padding:7px 9px;font-size:11.5px;color:var(--sub);}
  .grocery .gi b{color:var(--txt);display:block;font-size:12px;}
  .section-title{margin:12px 0 6px;font-size:13.5px;font-weight:900;color:var(--gold);}

  .weekly-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin-top:9px;}
  .weekly-grid .tf{background:var(--card2);border:1px solid var(--line);border-radius:9px;padding:7px;}
  .weekly-grid label{display:block;font-size:10px;color:var(--sub);margin-bottom:4px;font-weight:800;}
  .weekly-grid input,.weekly-grid textarea{width:100%;box-sizing:border-box;background:var(--card);border:1px solid var(--line);color:var(--txt);border-radius:7px;padding:7px;font-family:inherit;}
  .weekly-grid textarea{min-height:64px;resize:vertical;}
  .weekly-wide{grid-column:1/-1;}
  .weekly-status{font-size:11px;color:var(--ok);margin-top:7px;text-align:center;font-weight:800;}


  body{font-size:16px;}
  .app{max-width:680px;padding:10px 10px 90px;}
  .top{position:sticky;top:0;z-index:20;background:rgba(14,14,16,.96);backdrop-filter:blur(8px);padding:8px 0 10px;}
  .top .day{font-size:21px;}
  .top .date{font-size:13px;}
  .tabs{display:flex;gap:7px;overflow-x:auto;overscroll-behavior-x:contain;scrollbar-width:thin;position:sticky;top:66px;z-index:19;background:rgba(14,14,16,.98);padding:7px 0;white-space:nowrap;}
  .tab{flex:0 0 auto;padding:10px 13px;font-size:12.5px;white-space:nowrap;}
  .card{padding:12px;border-radius:16px;}
  .card h2{font-size:16px;}
  .ex{padding:11px 10px;min-height:50px;}
  .ex .nm{font-size:14px;}
  .ex .st{font-size:12px;}
  .bigbtn{min-height:48px;font-size:15px;}
  .quickbar{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:8px 0 10px;}
  .qbtn{border:1px solid var(--line);background:var(--card);color:var(--txt);border-radius:12px;padding:10px 5px;font:inherit;font-size:12px;font-weight:800;cursor:pointer;}
  .qbtn.active{background:var(--accent);border-color:var(--accent);}
  .accordion-title{display:flex;align-items:center;justify-content:space-between;gap:8px;cursor:pointer;user-select:none;}
  .accordion-title .arr{transition:transform .2s;opacity:.7;}
  .collapsed .accordion-body{display:none;}
  .collapsed .accordion-title .arr{transform:rotate(-90deg);}
  .today-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:10px;}
  .sum{background:var(--card2);border:1px solid var(--line);border-radius:11px;padding:8px;text-align:center;}
  .sum b{display:block;font-size:16px;color:var(--gold);}
  .sum span{font-size:10.5px;color:var(--sub);}
  .soft-note{background:#151923;border:1px solid #263348;color:#cbd5e1;border-radius:11px;padding:9px 10px;font-size:12px;margin-bottom:9px;}
  .sticky-save{position:fixed;left:50%;bottom:10px;transform:translateX(-50%);z-index:30;width:min(660px,calc(100% - 20px));display:flex;gap:8px;}
  .sticky-save button{flex:1;}
  .hidden{display:none!important;}
  @media(max-width:520px){
    .tabs{gap:6px;}
    .tab{font-size:12px;padding:9px 12px;}
    .quickbar{grid-template-columns:repeat(2,1fr);}
    .today-summary{grid-template-columns:repeat(3,1fr);}
    .weekly-grid{grid-template-columns:1fr;}
    .weekly-wide{grid-column:auto;}
  }


  .status-card{border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:10px;background:var(--card);}
  .status-card.match{border-color:#7f1d1d;background:#241315;}
  .status-card.prematch{border-color:#854d0e;background:#241d0f;}
  .status-card.recovery{border-color:#14532d;background:#102019;}
  .status-card.normal{border-color:#1e3a5f;background:#111a27;}
  .status-title{font-size:17px;font-weight:900;margin-bottom:4px;}
  .status-sub{font-size:12px;color:var(--sub);line-height:1.7;}
  .pillrow{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;}
  .pill{border:1px solid var(--line);background:var(--card2);border-radius:999px;padding:4px 9px;font-size:10.5px;font-weight:800;}
  .sched-grid{display:grid;grid-template-columns:1fr;gap:8px;}
  .sched-day{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px;}
  .sched-day b{display:block;margin-bottom:4px;}
  .matchitem{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:9px;margin:6px 0;font-size:12px;}
  .settingrow{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px;}
  .settingrow input[type="checkbox"]{width:22px;height:22px;accent-color:var(--ok);}
  .settingrow input[type="date"]{background:var(--card);color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:7px;}
  .modehint{font-size:11px;color:var(--gold);margin-top:6px;}
  .plan-nav{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;margin:8px 0 12px;}
  .plan-nav button{border:1px solid var(--line);background:var(--card2);color:var(--txt);border-radius:11px;padding:10px 8px;font:inherit;font-size:12.5px;font-weight:850;cursor:pointer;text-align:center;}
  .plan-nav button:active{border-color:var(--accent);}
  .plan-section .accordion-title{padding:2px 0;}
  .plan-section .accordion-title b{font-size:15px;line-height:1.5;}
  .plan-section .accordion-body{margin-top:9px;}
  .plan-section{scroll-margin-top:145px;}
  .plan-intro{border-color:#71313a;background:linear-gradient(145deg,#241416,#1c1c20);}
  .club-card{border-color:#334155;background:linear-gradient(145deg,#121b29,#1c1c20);}
  .plan-nav-title{font-weight:900;margin:4px 0 7px;font-size:13px;color:var(--sub);}



  .dev-grid{display:grid;grid-template-columns:1fr;gap:8px;}
  .dev-card{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px;}
  .dev-card h3{margin:0 0 5px;font-size:14px;}
  .cue{font-size:17px;font-weight:900;text-align:center;padding:10px;background:var(--card2);border:1px solid var(--line);border-radius:11px;margin:7px 0;color:var(--gold);}
  .balltag{display:inline-block;margin:3px 0 6px;padding:4px 8px;border-radius:999px;background:#172033;border:1px solid #283a5a;font-size:11px;font-weight:800;color:#dbeafe;}
  .why{font-size:11.5px;color:var(--sub);line-height:1.7;margin-top:5px;}
  .video-analyzer video{width:100%;max-height:360px;border-radius:12px;background:#000;margin:8px 0;}
  .speedrow{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0;}
  .speedrow button,.mini-btn{border:1px solid var(--line);background:var(--card2);color:var(--txt);border-radius:9px;padding:8px 10px;font-weight:800;font-family:inherit;cursor:pointer;}
  .uploadbox{display:block;border:1px dashed var(--line);border-radius:12px;padding:12px;text-align:center;background:var(--card2);cursor:pointer;font-weight:800;}
  .uploadbox input{display:none;}
  .dev-notes{width:100%;min-height:90px;background:var(--card2);color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:9px;font-family:inherit;resize:vertical;}
  .metric-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;}

</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="day" id="dayTitle">📅</div>
    <div class="date" id="dateSub"></div>
  </div>

  <div class="tabs" aria-label="أقسام البرنامج">
    <button class="tab active" id="tabTrain" onclick="showTab('train')">🏠 اليوم</button>
    <button class="tab" id="tabWeek" onclick="showTab('week')">🗓️ الأسبوع</button>
    <button class="tab" id="tabSchedule" onclick="showTab('schedule')">🎓🏐 الجدول</button>
    <button class="tab" id="tabReport" onclick="showTab('report')">📊 التقرير</button>
    <button class="tab" id="tabFood" onclick="showTab('food')">🍽️ الأكل</button>
  </div>

  <div id="trainBox"></div>
  <div id="weekBox" style="display:none;"></div>
  <div id="scheduleBox" style="display:none;"></div>
  <div id="reportBox" style="display:none;"></div>
  <div id="foodBox" style="display:none;"></div>
</div>

<script>
"use strict";
var AR_DAYS=["الأحد","الاثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"];
var AR_MONTHS=["يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"];
function todayKey(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function fmtDate(d){return d.getDate()+" "+AR_MONTHS[d.getMonth()]+" "+d.getFullYear();}
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

/* ===== مكتبة تمارين صباح/مساء — اختر جرعة قصيرة واحدة حسب حمل الفريق ===== */
var SCHED=[
 {day:"الأحد",title:"راحة واستشفاء",cal:"راحة • 10–15 دقيقة حركة اختيارية",am:[],pm:[]},
 {day:"الاثنين",title:"قوة A + ثبات الكاحل",cal:"30–35 دقيقة",am:[{cat:"🧱 قوة الجسم السفلي",ex:[["Chair Squat","2×8"],["Glute Bridge","2×10"],["Supported Split Squat","2×6/رجل"]]},{cat:"🦶 ثبات الكاحل والجذع",ex:[["Calf Raise","2×12"],["Single-Leg Balance","2×20ث/رجل"],["Dead Bug","2×8/جهة"]]}],pm:[]},
 {day:"الثلاثاء",title:"تحمل أساسي + حركة",cal:"25–30 دقيقة",am:[{cat:"❤️ التحمل الهوائي",ex:[["مشي سريع أو دراجة سهلة","20–22 دقيقة — تستطيع التحدث بجمل كاملة"]]},{cat:"🤸 الحركة",ex:[["Ankle Rocks","2×10/رجل"],["Hip Mobility","2×8"]]}],pm:[]},
 {day:"الأربعاء",title:"مهارات Pivot والاستلام",cal:"25–30 دقيقة",am:[{cat:"🏐 استقبال وتحكم",ex:[["حائط استلام خفيف (بيدين)","3×8"],["Low Ball Pickup","2×6"],["Catch → Protect → Turn","2×5"]]},{cat:"🧠 حركة وقرار",ex:[["حركة قدم Pivot 3 نقاط","2×3 جولات"],["استلام متحرك من الحائط","2×5"]]}],pm:[]},
 {day:"الخميس",title:"قوة B + الجزء العلوي",cal:"25–30 دقيقة",am:[{cat:"💪 قوة الجزء العلوي",ex:[["Push-up","2×8"],["Band Row","2×10"],["Band Pull-Apart","2×12"]]},{cat:"🧱 الكتف والجذع",ex:[["Band External Rotation","2×12/جهة"],["Side Plank","2×20ث/جهة"]]}],pm:[]},
 {day:"الجمعة",title:"سرعة قصيرة + قوة انفجارية",cal:"20–25 دقيقة • جودة عالية وراحة كاملة",am:[{cat:"🔥 إحماء",ex:[["Ankle Rocks","2×10/رجل"],["A-March","2×10م"]]},{cat:"⚡ السرعة",ex:[["انطلاق 5م","4 مرات — راحة 2 دقيقة"],["توقف متزن بعد الانطلاق","3 مرات"]]},{cat:"⬆️ القوة الانفجارية — شرط الكاحل",ex:[["قفزات صغيرة والهبوط بثبات","2×3 — فقط دون ألم أو عدم ثبات"]]}],pm:[]},
 {day:"السبت",title:"تحمل متكرر خاص بكرة اليد",cal:"15–20 دقيقة • تُستبدل بالمباراة إذا كان لديك مباراة",am:[{cat:"🏃 جهد متكرر مضبوط",ex:[["تحرك سريع 10 ثوانٍ ثم مشي","5 جولات — راحة 50 ثانية"],["مشي هادئ للتبريد","5 دقائق"]]},{cat:"🟡 شرط التنفيذ",ex:[["إذا كان الكاحل يؤلمك أو غير ثابت","ألغِ الجولات واكتفِ بالمشي المريح"]]}],pm:[]}
];

/* ===== خطة التدرج 8 أسابيع =====
الأسبوع 1: تأسيس — RIR3، Plyo منخفض الحجم، تعلم الهبوط والاستلام النظيف.
الأسبوع 2: تثبيت — نفس التمارين، +2.5–5% للأوزان فقط إذا بقيت التقنية ممتازة.
الأسبوع 3: بناء — RIR2-3، أضف جولة واحدة لبعض السرعة/الاستلام فقط إذا الجودة ثابتة.
الأسبوع 4: DELOAD — خفّض المجموعات 35–40%، لا أرقام قياسية، حافظ على السرعة.
الأسبوع 5: Performance I — مقاومة أعلى قليلاً، استقبال Seal/Band، Reactive Speed.
الأسبوع 6: Performance II — شدة أعلى مع نفس الحجم تقريباً، لا تدريب حتى الفشل.
الأسبوع 7: Peak Quality — أعلى جودة/سرعة، حجم أقل 10–15%، استقبال بسرعة مباراة.
الأسبوع 8: Taper + Test — خفّض الحجم 40–50% واختبر 5m، Broad Jump، الاستلام 30 كرة.
قواعد: توقف عن Plyo/Sprint إذا انخفضت الجودة بوضوح؛ لا تضف تمارين فوق الجدول؛ يوم الجمعة راحة.
===== */

  "Broad Jump أمامي":"broad jump","Bench Press":"bench press","Bent-Over Row بار":"bent over barbell row",

  "Chair Squat":"chair squat exercise","Glute Bridge":"glute bridge exercise","Supported Split Squat":"supported split squat exercise","Single-Leg Balance":"single leg balance exercise","Dead Bug":"dead bug core exercise","Ankle Rocks":"ankle mobility rocks","Hip Mobility":"hip mobility exercises","Band Row":"resistance band row exercise","Band Pull-Apart":"resistance band pull apart exercise","A-March":"A march running drill","انطلاق 5م":"5 meter acceleration sprint","قفزات صغيرة والهبوط بثبات":"small jump landing mechanics",
  "Push-up":"push up form","Lat Pulldown":"lat pulldown","Dumbbell Shoulder Press":"dumbbell shoulder press",

function parseYMD(s){var p=s.split("-");return new Date(+p[0],+p[1]-1,+p[2],12,0,0);}

function dayMode(k){
  var ms=activeMatches();
  var today=ms.filter(function(m){return m.date===k;});
  var tomorrow=ms.filter(function(m){return daysDiff(m.date,k)===1;});
  var yesterday=ms.filter(function(m){return daysDiff(k,m.date)===1;});
  if(today.length)return {type:"match",matches:today};
  if(tomorrow.length&&yesterday.length)return {type:"between",next:tomorrow,prev:yesterday};

  return {type:"normal",matches:[]};
}
