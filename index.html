<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>علي — التمرين والتغذية 🏐</title>
<style>
  :root{--bg:#0e0e10;--card:#1c1c20;--card2:#25252c;--line:#2f2f37;--txt:#f5f5f7;--sub:#9aa0a6;--ok:#1fd07c;--accent:#e11d2d;--gold:#ffdf6b;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,Tahoma,sans-serif;font-size:15px;line-height:1.6;}
  .app{max-width:560px;margin:0 auto;padding:12px 10px 50px;}
  .top{text-align:center;margin-bottom:10px;}
  .top .day{font-size:19px;font-weight:900;}
  .top .date{color:var(--sub);font-size:12.5px;}
  .tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px;}
  .tab{border:none;border-radius:12px;padding:12px;font-size:15px;font-weight:900;cursor:pointer;font-family:inherit;background:var(--card);border:1px solid var(--line);color:var(--sub);}
  .tab.active{background:var(--accent);color:#fff;border-color:var(--accent);}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px;}
  .card h2{margin:0 0 6px;font-size:15.5px;}
  .muted{color:var(--sub);font-size:12px;}
  .ex{display:flex;align-items:center;gap:9px;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:9px 10px;margin-bottom:7px;}
  .ex input{width:21px;height:21px;accent-color:var(--ok);flex-shrink:0;}
  .ex .nm{flex:1;font-weight:700;font-size:13.5px;}
  .ex .st{color:var(--gold);font-weight:800;white-space:nowrap;font-size:12px;}
  .ex.done{opacity:.5;} .ex.done .nm{text-decoration:line-through;}
  .vidrow{display:flex;gap:5px;flex-wrap:wrap;margin:3px 0 9px 22px;}
  .vbtn{border:none;color:#fff;border-radius:8px;padding:6px 11px;font-size:11.5px;font-weight:700;cursor:pointer;font-family:inherit;}
  .pbar{height:8px;background:var(--card2);border-radius:99px;overflow:hidden;margin-top:5px;}
  .pbar div{height:100%;background:var(--ok);border-radius:99px;transition:width .3s;}
  .plabel{font-size:12px;color:var(--sub);text-align:center;margin-top:3px;}
  .habit{display:flex;align-items:center;gap:9px;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:9px 10px;margin-bottom:6px;}
  .habit input{width:19px;height:19px;accent-color:var(--ok);}
  .habit .nm{flex:1;font-weight:700;font-size:13px;}
  .habit.done{opacity:.5;} .habit.done .nm{text-decoration:line-through;}
  .toplog{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px;}
  .toplog .tf{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:5px 3px;text-align:center;}
  .toplog label{display:block;font-size:9.5px;color:var(--sub);margin-bottom:2px;font-weight:700;}
  .toplog input{width:100%;background:var(--card2);border:1px solid var(--line);color:var(--txt);border-radius:7px;padding:5px 2px;font-size:14px;font-family:inherit;text-align:center;}
  .alt{font-size:11.5px;color:var(--sub);margin:-1px 0 7px 20px;line-height:1.5;}
  .alt b{color:var(--gold);}
  .exbox{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 10px;margin-bottom:8px;}
  .exname{background:transparent;border:none;color:var(--txt);text-align:right;cursor:pointer;padding:0;font-family:inherit;}
  .exname:after{content:" 💡";opacity:.6;}
  .exinfo{font-size:12.5px;color:var(--sub);background:var(--card2);border:1px dashed var(--line);border-radius:8px;padding:8px 10px;margin:6px 0;line-height:1.7;}
  .exhelp-btn{display:block;width:100%;margin:6px 0 2px;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:#202a38;color:#dbeafe;font:700 12.5px system-ui,Tahoma,sans-serif;text-align:right;cursor:pointer;}
  .exinfo b{color:var(--gold);}
  .bigbtn{display:block;width:100%;border:none;border-radius:13px;padding:13px;font-size:14.5px;font-weight:900;cursor:pointer;font-family:inherit;background:var(--accent);color:#fff;}
  .bigbtn.green{background:var(--ok);color:#06210f;}
  .note{background:#1e1a0a;border:1px solid #6b5900;color:var(--gold);border-radius:10px;padding:8px 10px;font-size:11.5px;margin-bottom:10px;}
  .mini{font-size:11px;color:var(--sub);text-align:center;margin-top:7px;}
  .sess-head{display:flex;align-items:center;gap:8px;margin:12px 0 7px;}
  .sess-head .ic{font-size:20px;}
  .sess-head b{font-size:15px;}
  .sess-head .tag{background:var(--card2);border:1px solid var(--line);color:var(--sub);border-radius:20px;padding:2px 9px;font-size:10.5px;}
  .foodrow{display:flex;align-items:center;gap:9px;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:9px 10px;margin-bottom:7px;}
  .foodrow input{width:19px;height:19px;accent-color:var(--ok);flex-shrink:0;}
  .foodrow .ft{flex:1;}
  .foodrow .ft b{display:block;font-size:13px;}
  .foodrow .ft span{color:var(--sub);font-size:11.5px;}
  .foodrow .fc{color:var(--sub);font-size:11px;white-space:nowrap;text-align:left;}
  .grocery{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
  .grocery .gi{background:var(--card2);border:1px solid var(--line);border-radius:9px;padding:7px 9px;font-size:11.5px;color:var(--sub);}
  .grocery .gi b{color:var(--txt);display:block;font-size:12px;}
  .section-title{margin:12px 0 6px;font-size:13.5px;font-weight:900;color:var(--gold);}

  .weekly-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin-top:9px;}
  .weekly-grid .tf{background:var(--card2);border:1px solid var(--line);border-radius:9px;padding:7px;}
  .weekly-grid label{display:block;font-size:10px;color:var(--sub);margin-bottom:4px;font-weight:800;}
  .weekly-grid input,.weekly-grid textarea{width:100%;box-sizing:border-box;background:var(--card);border:1px solid var(--line);color:var(--txt);border-radius:7px;padding:7px;font-family:inherit;}
  .weekly-grid textarea{min-height:64px;resize:vertical;}
  .weekly-wide{grid-column:1/-1;}
  .weekly-status{font-size:11px;color:var(--ok);margin-top:7px;text-align:center;font-weight:800;}


  body{font-size:16px;}
  .app{max-width:680px;padding:10px 10px 90px;}
  .top{position:sticky;top:0;z-index:20;background:rgba(14,14,16,.96);backdrop-filter:blur(8px);padding:8px 0 10px;}
  .top .day{font-size:21px;}
  .top .date{font-size:13px;}
  .tabs{display:flex;gap:7px;overflow-x:auto;overscroll-behavior-x:contain;scrollbar-width:thin;position:sticky;top:66px;z-index:19;background:rgba(14,14,16,.98);padding:7px 0;white-space:nowrap;}
  .tab{flex:0 0 auto;padding:10px 13px;font-size:12.5px;white-space:nowrap;}
  .card{padding:12px;border-radius:16px;}
  .card h2{font-size:16px;}
  .ex{padding:11px 10px;min-height:50px;}
  .ex .nm{font-size:14px;}
  .ex .st{font-size:12px;}
  .bigbtn{min-height:48px;font-size:15px;}
  .quickbar{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:8px 0 10px;}
  .qbtn{border:1px solid var(--line);background:var(--card);color:var(--txt);border-radius:12px;padding:10px 5px;font:inherit;font-size:12px;font-weight:800;cursor:pointer;}
  .qbtn.active{background:var(--accent);border-color:var(--accent);}
  .accordion-title{display:flex;align-items:center;justify-content:space-between;gap:8px;cursor:pointer;user-select:none;}
  .accordion-title .arr{transition:transform .2s;opacity:.7;}
  .collapsed .accordion-body{display:none;}
  .collapsed .accordion-title .arr{transform:rotate(-90deg);}
  .today-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:10px;}
  .sum{background:var(--card2);border:1px solid var(--line);border-radius:11px;padding:8px;text-align:center;}
  .sum b{display:block;font-size:16px;color:var(--gold);}
  .sum span{font-size:10.5px;color:var(--sub);}
  .soft-note{background:#151923;border:1px solid #263348;color:#cbd5e1;border-radius:11px;padding:9px 10px;font-size:12px;margin-bottom:9px;}
  .sticky-save{position:fixed;left:50%;bottom:10px;transform:translateX(-50%);z-index:30;width:min(660px,calc(100% - 20px));display:flex;gap:8px;}
  .sticky-save button{flex:1;}
  .hidden{display:none!important;}
  @media(max-width:520px){
    .tabs{gap:6px;}
    .tab{font-size:12px;padding:9px 12px;}
    .quickbar{grid-template-columns:repeat(2,1fr);}
    .today-summary{grid-template-columns:repeat(3,1fr);}
    .weekly-grid{grid-template-columns:1fr;}
    .weekly-wide{grid-column:auto;}
  }


  .status-card{border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:10px;background:var(--card);}
  .status-card.match{border-color:#7f1d1d;background:#241315;}
  .status-card.prematch{border-color:#854d0e;background:#241d0f;}
  .status-card.recovery{border-color:#14532d;background:#102019;}
  .status-card.normal{border-color:#1e3a5f;background:#111a27;}
  .status-title{font-size:17px;font-weight:900;margin-bottom:4px;}
  .status-sub{font-size:12px;color:var(--sub);line-height:1.7;}
  .pillrow{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;}
  .pill{border:1px solid var(--line);background:var(--card2);border-radius:999px;padding:4px 9px;font-size:10.5px;font-weight:800;}
  .sched-grid{display:grid;grid-template-columns:1fr;gap:8px;}
  .sched-day{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px;}
  .sched-day b{display:block;margin-bottom:4px;}
  .matchitem{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:9px;margin:6px 0;font-size:12px;}
  .settingrow{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px;}
  .settingrow input[type="checkbox"]{width:22px;height:22px;accent-color:var(--ok);}
  .settingrow input[type="date"]{background:var(--card);color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:7px;}
  .modehint{font-size:11px;color:var(--gold);margin-top:6px;}
  .plan-nav{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;margin:8px 0 12px;}
  .plan-nav button{border:1px solid var(--line);background:var(--card2);color:var(--txt);border-radius:11px;padding:10px 8px;font:inherit;font-size:12.5px;font-weight:850;cursor:pointer;text-align:center;}
  .plan-nav button:active{border-color:var(--accent);}
  .plan-section .accordion-title{padding:2px 0;}
  .plan-section .accordion-title b{font-size:15px;line-height:1.5;}
  .plan-section .accordion-body{margin-top:9px;}
  .plan-section{scroll-margin-top:145px;}
  .plan-intro{border-color:#71313a;background:linear-gradient(145deg,#241416,#1c1c20);}
  .club-card{border-color:#334155;background:linear-gradient(145deg,#121b29,#1c1c20);}
  .plan-nav-title{font-weight:900;margin:4px 0 7px;font-size:13px;color:var(--sub);}



  .dev-grid{display:grid;grid-template-columns:1fr;gap:8px;}
  .dev-card{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px;}
  .dev-card h3{margin:0 0 5px;font-size:14px;}
  .cue{font-size:17px;font-weight:900;text-align:center;padding:10px;background:var(--card2);border:1px solid var(--line);border-radius:11px;margin:7px 0;color:var(--gold);}
  .balltag{display:inline-block;margin:3px 0 6px;padding:4px 8px;border-radius:999px;background:#172033;border:1px solid #283a5a;font-size:11px;font-weight:800;color:#dbeafe;}
  .why{font-size:11.5px;color:var(--sub);line-height:1.7;margin-top:5px;}
  .video-analyzer video{width:100%;max-height:360px;border-radius:12px;background:#000;margin:8px 0;}
  .speedrow{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0;}
  .speedrow button,.mini-btn{border:1px solid var(--line);background:var(--card2);color:var(--txt);border-radius:9px;padding:8px 10px;font-weight:800;font-family:inherit;cursor:pointer;}
  .uploadbox{display:block;border:1px dashed var(--line);border-radius:12px;padding:12px;text-align:center;background:var(--card2);cursor:pointer;font-weight:800;}
  .uploadbox input{display:none;}
  .dev-notes{width:100%;min-height:90px;background:var(--card2);color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:9px;font-family:inherit;resize:vertical;}
  .metric-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;}

.train-day-nav{display:flex;gap:6px;overflow-x:auto;padding:8px 0 5px;scrollbar-width:thin}
.train-day-btn{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--sub);border-radius:10px;padding:9px 12px;font:800 12px system-ui,Tahoma,sans-serif;cursor:pointer}
.train-day-btn.active{background:var(--accent);border-color:var(--accent);color:#fff}
.exinfo{line-height:1.8}
.vbtn.youtube-only{background:#e11d2d;color:#fff;text-decoration:none;display:inline-flex;align-items:center}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="day" id="dayTitle">📅</div>
    <div class="date" id="dateSub"></div>
  </div>

  <div class="tabs" aria-label="أقسام البرنامج">
    <button class="tab active" id="tabTrain" onclick="showTab('train')">🏋️ التمارين اليومية</button>
    <button class="tab" id="tabFood" onclick="showTab('food')">🍽️ التغذية</button>
  </div>
  <div id="trainDayNav" class="train-day-nav" aria-label="اختيار يوم التدريب"></div>
  <div id="trainBox"></div>
  <div id="foodBox" style="display:none;"></div>

</div>

 "Half-Kneeling Landmine Press":"اتخذ وضع الركوع نصفياً: ركبة على الأرض والقدم الأخرى أمامك، مع شد خفيف للجذع والحوض. أمسك نهاية البار بيد الجهة المقابلة للركبة الأمامية أو حسب توجيه المدرب. ادفع البار للأمام وللأعلى على مساره الطبيعي، دون تقويس أسفل الظهر أو رفع الكتف قرب الأذن. أعده بتحكم وبدّل الجهة.",
 "Farmer Carry":"امسك وزناً مناسباً في كل يد، قف طويلاً مع شد خفيف للبطن والكتفين بمستوى طبيعي. امشِ بخطوات قصيرة وثابتة لمسافة التمرين، من دون ميل الجذع أو تأرجح الأوزان. ضع الأوزان أرضاً بتحكم. اختر حملاً يسمح لك بالحفاظ على الوضعية طوال المسافة.",
 "Face Pull":"ثبّت الحبل عند مستوى الوجه تقريباً. امسك طرفيه واسحب باتجاه الأنف أو أعلى الوجه مع فتح اليدين للخارج وتوجيه المرفقين للخلف. حافظ على الأضلاع والحوض ثابتين ولا ترفع الكتفين. ارجع ببطء. استخدم مقاومة خفيفة تسمح بحركة نظيفة.",
 "Grip Hold":"امسك مقبضاً أو دمبلين مناسبين بإحكام، والمعصم مستقيم والكتفان مستقران. حافظ على القبضة للمدة المحددة دون حبس النفس أو ثني المعصم. أوقف المجموعة إذا بدأ الوزن ينزلق أو ظهر ألم في الأصابع أو الرسغ.",
  "Back Squat صندوق ناعم":"اجلس على صندوق بارتفاع ركبتك، انزل ببطء 3 ثوانٍ ثم قم بانفجار. ظهر مستقيم، صدر مرفوع.",
  "Broad Jump أمامي (بساط/نجيل)":"قفزة أمامية طويلة بأقصى قوة على أرض ناعمة، انزل بهدوء (سوفت).",

  "حائط استلام خفيف (بيدين)":"ارمِ الكرة على الحائط واستلمها بيدين مفرودتين — أصابع مفرودة وامتصاص.",
  "استلام إلى نقطة اليد (مع زميل)":"اطلب من زميلك تمريرات دقيقة أولاً إلى اليدين. جهّز اليدين مبكراً أمام مسار الكرة، مدّهما نحو نقطة وصولها، افتح الأصابع ثم اسحب الذراعين قليلاً لامتصاص الكرة. ابدأ ببطء ومن دون مدافع.",
  "استلام متحرك خطوتين":"ابدأ من وضع Pivot، تحرك خطوتين لتفتح زاوية تمرير، أظهر يديك كهدف واضح، ثم استقبل الكرة بكلتا اليدين وأنت متوازن. لا تمد يديك قبل أن تتضح جهة التمريرة.",
  "استلام من جهتين مختلفتين":"يقف الزميل أمامك ويمرر بالتناوب إلى يمينك ويسارك ضمن مدى مريح. حرّك القدمين والجذع أولاً لتقابل مسار الكرة، ثم مدّ اليدين. لا تحاول الوصول بمدّ الذراع فقط إذا كانت الكرة بعيدة؛ غيّر موقعك.",
  "هدف الحصة + تنفس هادئ":"خذ 4 أنفاس هادئة دون حبس النفس، ثم حدد هدفاً سلوكياً واحداً للحصة مثل: أجهز يدي مبكراً وأطلب الكرة بوضوح. لا تحاول التحكم في النتيجة؛ ركز على المهمة.",
  "التحرك دون كرة وفتح زاوية":"راقب المدافع والكرة معاً، غيّر زاويتك بخطوات قصيرة، واظهر لزميلك مساحة واضحة للتمرير. طبّق داخل تدريب الفريق فقط.",
  "ملاحظة Pivot بعد التدريب":"اكتب أفضل تحرك نفذته اليوم، وشيئاً واحداً تريد تحسينه في الحصة القادمة.",
  "روتين الكرة التالية":"بعد الخطأ: زفير هادئ، قل لنفسك «الكرة التالية»، ثم ارجع مباشرة لموقعك الدفاعي أو الهجومي.",
  "تخيل موقف دفاعي ناجح":"أغمض عينيك وتخيل موقفاً واقعياً: تثبيت قانوني، قدمان متوازنتان، قراءة حركة المهاجم، ثم قرار دفاعي صحيح. تخيل التنفيذ بهدوء لا النتيجة فقط.",
  "ثبات وضعية Pivot والالتحام القانوني":"حافظ على قاعدة قدمين متوازنة، جذع ثابت، وذراعين ضمن الحدود القانونية. لا تدفع أو تمسك المنافس؛ نفذ حسب تعليمات مدربك.",
  "قراءة حركة المدافع":"راقب اتجاه الحوض والقدمين والمسافة، ولا تلتزم بحركة مسبقة. اختر زاوية تحرك تناسب التمريرة وموقف اللعب.",
  "استلام ثم قرار (تمرير/دوران)":"بعد الاستلام الآمن، ارفع نظرك سريعاً: إذا كان المسار مفتوحاً فاستدر بتوازن، وإذا أغلق المدافع المساحة مرر لزميلك. ابدأ دون ضغط ثم زد الضغط بإشراف المدرب.",
  "كلمة تركيز قبل الاستلام":"اختر إشارة قصيرة مثل «شوف–تحرك–استلم». قلها داخلياً قبل كل محاولة لتذكير نفسك بمتابعة الكرة وتحريك القدمين.",
  "تحليل فيديو Pivot":"شاهد 10–15 دقيقة. أوقف الفيديو قبل التمريرة ولاحظ أين يقف Pivot، كيف يفتح زاوية، ومتى يتحرك. اختر لقطة واحدة لتطبيقها في التدريب.",
  "مراجعة الأسبوع وكتابة 3 ملاحظات":"اكتب نجاحاً واحداً، أمراً يحتاج إلى تحسين، وسؤالاً واحداً لمدربك. لا تحول يوم الراحة إلى تدريب بدني.",
  "روتين ما قبل التدريب أو المباراة":"تنفس بهدوء، راجع دورك، وتخيل أول استلام ناجح. ركز على السلوك الذي تتحكم فيه: الحركة، طلب الكرة، والقرار.",
  "هدفان للمباراة/الحصة":"اختر هدفين قابلين للتنفيذ مثل: أفتح زاوية تمرير مرتين على الأقل، وأبقى جاهزاً لاستلام كل تمريرة. لا تجعل الهدف عدد الأهداف فقط.",
  "تطبيق الاستلام والتمركز والدفاع":"نفذ مهاراتك ضمن تدريب الفريق أو المباراة. لا تضف جرياً أو جيم بعد ذلك.",

function makeAccordion(card,title,openByDefault){
  if(!card)return;
  var body=document.createElement("div");
  body.className="accordion-body";
  while(card.firstChild)body.appendChild(card.firstChild);
  var h=document.createElement("div");
  h.className="accordion-title";
  h.innerHTML="<h2 style='margin:0'>"+title+"</h2><span class='arr'>▼</span>";
  card.appendChild(h);card.appendChild(body);
  if(!openByDefault)card.classList.add("collapsed");
  h.onclick=function(){card.classList.toggle("collapsed");};
}

function savePivotCampLog(){

 "Wall High / Chest Reception":"وضع البداية: قف على مسافة مريحة من الحائط واليدين جاهزتين أمام الصدر. التنفيذ: نفّذ تمريرات ترتد عند مستوى الصدر، ثم أعلى قليلاً ضمن مدى مريح. تحرك بالقدمين لتقابل الكرة، افتح الأصابع واجعل اليدين خلف الكرة، ثم اثنِ المرفقين واسحب الكرة نحو الصدر. لا تقفز لتمريرات يمكن استقبالها بخطوة. التنفس مستمر. الأخطاء: إبقاء اليدين متأخرتين، أو استقبال الكرة بأصابع مشدودة، أو إغلاق العينين عند وصولها. ابدأ بارتفاع واحد ثم نوّع الارتفاع.",
 "Wall Lateral Step + Catch":"وضع البداية: قف أمام الحائط وعلامة صغيرة على كل جانب. التنفيذ: مرر الكرة بزاوية تجعل ارتدادها إلى أحد الجانبين، تحرك بخطوة أو خطوتين قصيرتين لتصبح أمام مسارها، ثم استقبل بكلتا اليدين وثبّت الكرة قبل العودة. كرر للجهتين. حافظ على الجذع متوازناً ولا تقاطع القدمين بسرعة. التنفس طبيعي. الخطأ: مد الذراعين فقط دون تحريك القدمين، أو الاندفاع وفقدان التوازن. الهدف: تعلّم الوصول إلى خط التمريرة بدلاً من انتظارها.",
 "Catch → Secure → Reset":"وضع البداية: قف بوضع استعداد Pivot أمام الحائط أو مع زميل. التنفيذ: استقبل الكرة بكلتا اليدين، اسحبها إلى منطقة آمنة قرب الصدر أو جانب الجذع، ثبّت القبضة دون عصر مفرط، اثبت لحظة ثم أعد الكرة أو استعد للحركة التالية. حافظ على المرفقين قريبين من الجسم وعلى قاعدة قدمين متوازنة. التنفس طبيعي. الخطأ: إبعاد الكرة عن الجسم أو البدء بالدوران قبل السيطرة الكاملة. الهدف: تحويل اللمسة الأولى إلى استلام مضمون.",
 "Dynamic Gym Warm-up":"ابدأ بـ3–4 دقائق مشي أو دراجة سهلة. أضف Ankle Rocks وحركات الورك والكتف، ثم نفّذ مجموعة إحماء خفيفة جداً من أول تمرين جيم قبل وزن العمل. زد الحمل تدريجياً ولا تحتسب مجموعات الإحماء كمجموعات عمل. التنفس منتظم. الخطأ: الانتقال مباشرة إلى الوزن العامل أو أداء إطالات قوية طويلة قبل القوة. الهدف: تحضير الجسم والحركة التي ستستخدمها في الجلسة.",
 "Mini-Band Lateral Walk":"وضع البداية: ضع الحلقة المطاطية حول الفخذين فوق الركبتين كبداية، وقدماك بعرض الحوض. اثنِ الركبتين والوركين قليلاً وحافظ على شد خفيف مستمر في الحلقة. التنفيذ: خذ 8 خطوات جانبية قصيرة، ثم ارجع بالاتجاه الآخر. أبقِ أصابع القدمين للأمام والركبتين بمحاذاة القدمين. التنفس طبيعي. الأخطاء: جمع القدمين تماماً وفقدان الشد، تمايل الجذع، أو انهيار الركبتين للداخل. ابدأ بأخف حلقة ولا ترفع مقاومة المطاط على حساب التقنية.",
 "Goblet Squat":"وضع البداية: أمسك دمبلاً من أحد طرفيه أمام الصدر، والقدمان بعرض الكتفين تقريباً. التنفيذ: خذ شهيقاً وثبّت الجذع، ادفع الوركين للخلف وانزل بثني الركبتين ضمن مدى تستطيع التحكم به، واجعل الركبتين باتجاه أصابع القدمين. ادفع الأرض وازفر أثناء الوقوف. حافظ على الكعبين على الأرض والصدر مرتفعاً. الأخطاء: سقوط الركبتين للداخل، رفع الكعبين، أو تدوير الظهر. استخدم وزناً خفيفاً واطلب من المدرب مراجعة الحركة.",
 "Dumbbell Romanian Deadlift":"وضع البداية: أمسك دمبلين أمام الفخذين، والقدمان بعرض الحوض والركبتان مثنيتان قليلاً. التنفيذ: ادفع الوركين للخلف كأنك تغلق باباً بمؤخرتك، وانزل الدمبلين قريبين من الفخذين والساقين مع ظهر محايد. توقف عندما تشعر بتمدد مريح في خلف الفخذ، ثم ادفع الوركين للأمام وازفر للوقوف. الأخطاء: تحويل الحركة إلى سكوات، تدوير الظهر، أو إنزال الأوزان أكثر من مدى التحكم. ابدأ بوزن خفيف وتحت إشراف.",
 "Supported Split Squat":"وضع البداية: اتخذ خطوة أمامية وخلفية مريحة، وضع يدك على دعامة ثابتة للتوازن. التنفيذ: اثنِ الركبتين وانزل عمودياً بقدر مريح، مع بقاء الركبة الأمامية باتجاه أصابع القدم والقدم كاملة على الأرض. ادفع الأرض بالقدم الأمامية للعودة. ازفر عند الصعود. الأخطاء: خطوة ضيقة جداً، سقوط الركبة للداخل، أو الدفع باليد من الدعامة. استخدم مدى قصيراً في البداية وزده تدريجياً دون ألم.",
 "Calf Raise":"وضع البداية: قف بجانب حائط أو جهاز للتوازن، والقدمان متوازيتان. التنفيذ: ارفع الكعبين ببطء حتى تقف على مقدمة القدمين، اثبت لحظة، ثم انزل بتحكم حتى يقترب الكعبان من الأرض. ازفر عند الرفع. لا تتأرجح ولا تدع الكاحلين ينهاران للخارج أو الداخل. يمكن تقليل المدى إذا ظهر ألم. الهدف: تقوية عضلات السمانة ودعم الكاحل.",
 "Dead Bug":"وضع البداية: استلقِ على ظهرك، ارفع الذراعين نحو السقف والوركين والركبتين قرابة 90 درجة. شد البطن بلطف مع إبقاء أسفل الظهر ثابتاً ومريحاً على الأرض. التنفيذ: مد ذراعاً مع الرجل المقابلة ببطء، ثم عد وبدّل الجهة. ازفر أثناء المد وخذ شهيقاً عند العودة. الأخطاء: تقويس أسفل الظهر أو مد الطرفين بسرعة كبيرة. قلّل مدى الحركة إذا فقدت ثبات الجذع.",
 "Band Pallof Press":"وضع البداية: ثبّت المطاط الطويل إلى نقطة ثابتة عند مستوى منتصف الصدر، وقف جانبياً لنقطة التثبيت. أمسك الطرفين أمام الصدر مع قدمين ثابتتين. التنفيذ: ازفر وادفع اليدين للأمام، وقاوم سحب المطاط الذي يحاول تدوير الجذع، ثم أعد اليدين ببطء. نفّذ الجهتين. الأخطاء: لف الجذع أو تحريك الحوض أو استخدام مقاومة ثقيلة. تأكد من ثبات نقطة تثبيت المطاط قبل البدء.",
 "Mini-Band Glute Bridge Abduction":"وضع البداية: استلقِ على ظهرك، اثنِ الركبتين وضع القدمين بعرض الحوض، وضع الحلقة فوق الركبتين. التنفيذ: شد البطن وارفع الحوض حتى يصبح الجذع والفخذان بخط مريح، مع فتح الركبتين قليلاً ضد المطاط. اثبت لحظة ثم انزل بتحكم. ازفر عند رفع الحوض. الأخطاء: تقويس أسفل الظهر أو دفع الركبتين للداخل. اجعل الحركة من الورك وبمدى لا يسبب ألماً.",
 "Single-Leg Balance":"وضع البداية: قف قرب حائط أو دعامة، والقدمان متوازيتان. ارفع قدمك قليلاً عن الأرض واثبت على القدم الأخرى مع ثني بسيط للركبة. حافظ على الحوض مستوياً والركبة فوق اتجاه أصابع القدم. تنفس بهدوء. ابدأ 20 ثانية، ويمكنك لمس الحائط عند فقد التوازن. الأخطاء: قفل الركبة بقوة أو السماح لها بالانهيار للداخل. الهدف: تحسين توازن وتحكم القدم والكاحل.",
 "Ankle Rocks":"وضع البداية: قف أمام الحائط بوضع نصف اندفاع، والقدم الأمامية ثابتة والكعب على الأرض. التنفيذ: حرّك الركبة الأمامية إلى الأمام باتجاه الحائط فوق أصابع القدم، ثم ارجع. لا ترفع الكعب ولا تدع القدم تنهار للداخل. تنفس طبيعياً. يجب أن تشعر بحركة لطيفة في الكاحل، لا ألم أو ضغط حاد. كرر للقدمين.",
 "Adductor Rockback":"وضع البداية: اتخذ وضعية أربع نقاط على اليدين والركبتين، ثم مد إحدى الرجلين إلى الجانب مع بقاء القدم ملامسة للأرض. التنفيذ: ادفع الوركين للخلف ببطء حتى تشعر بتمدد خفيف داخل الفخذ، ثم عد للأمام. أبقِ الظهر محايداً ولا تدوّر الحوض. تنفس بهدوء ولا تضغط إلى ألم. بدّل الجهة. الهدف: تحسين مدى حركة العضلات الضامة.",
 "90/90 Hip Switch":"وضع البداية: اجلس على الأرض والركبتان مثنيتان، وضع الساقين أمامك بزاويتين قريبتين من 90 درجة. التنفيذ: دع الركبتين تتحركان من جهة إلى أخرى بتحكم، وبدّل وضع الوركين دون رميهما أو دفعهما باليدين بقوة. حافظ على الجذع طويلاً. تنفس طبيعياً. استخدم مدى صغيراً إذا كان الورك متيبساً. توقف إذا ظهر ألم حاد أو انحشار.",
 "Open Book Rotation":"وضع البداية: استلقِ على جانبك مع ثني الوركين والركبتين ووضعهما فوق بعضهما، ومد الذراعين أمام الصدر. التنفيذ: افتح الذراع العلوية إلى الخلف مع دوران أعلى الظهر، واتبع اليد بعينيك، ثم عد ببطء. أبقِ الركبتين متلاصقتين قدر الإمكان. تنفس مع فتح الصدر. لا تجبر الكتف أو أسفل الظهر على الدوران.",
 "Progressive 5m Acceleration":"وضع البداية: قف خلف خط البداية بوضع مريح، قدم أمام الأخرى قليلاً والجذع مائل للأمام بشكل طبيعي. التنفيذ: انطلق 5 أمتار عند 80–85%، وركز على أول خطوتين ودفع الأرض للخلف، مع حركة ذراعين عكسية. أبطئ بعد خط النهاية تدريجياً. خذ 60–90 ثانية راحة. الأخطاء: خطوات طويلة جداً من البداية أو التوقف المفاجئ. لا تنفذ إذا كان هناك ألم أو تعب واضح.",
 "10m Acceleration Sprint":"وضع البداية: جهّز نفسك على خط البداية مع ميل خفيف للجذع. انطلق لمسافة 10 أمتار بتسارع متدرج، ادفع الأرض بقوة، وارفع الجذع تدريجياً مع تقدم الخطوات. حرّك الذراعين للأمام والخلف دون عبور منتصف الجسم. استرح 90–120 ثانية بين المحاولات. لا تجعلها اختباراً أقصى في كل حصة. توقف إذا انخفضت السرعة أو تغيرت طريقة الجري.",
 "Low Vertical Jump + Stick":"وضع البداية: قف والقدمان بعرض الحوض والركبتان مرتاحتان. اثنِ الوركين والركبتين قليلاً، استخدم الذراعين للمساعدة ثم اقفز عمودياً قفزة منخفضة. اهبط بهدوء على القدمين مع ثني الوركين والركبتين، والركبتان باتجاه أصابع القدم، واثبت ثانيتين. لا تكرر إذا أصبح الهبوط صاخباً أو غير متوازن. احذف التمرين عند ألم الركبة أو الكاحل.",
 "Lateral Shuffle + Stick":"وضع البداية: اتخذ وضعية رياضية منخفضة قليلاً والقدمان أوسع من الحوض. ادفع من القدم البعيدة وتحرك جانبياً بخطوات قصيرة دون تقاطع القدمين، ثم اخفض السرعة وتوقف متوازناً لثانيتين. حافظ على الركبتين بمحاذاة القدمين. تنفس طبيعياً. الأخطاء: الوقوف عالياً، تقاطع القدمين، أو غرس القدم والتوقف بعنف. الهدف: تغيير الاتجاه والتباطؤ بأمان.",
 "Machine Chest Press":"وضع البداية: اضبط المقعد بحيث تكون المقابض بمستوى منتصف الصدر تقريباً، والقدمان ثابتتين والظهر على المسند. اسحب لوحي الكتف للخلف بلطف وامسك المقابض بمعصم مستقيم. ادفع للأمام وازفر دون قفل المرفقين، ثم ارجع ببطء مع شهيق. لا ترفع الكتفين أو تدع المرفقين يبتعدان كثيراً عن الجذع. استخدم حملاً تستطيع التحكم به.",
 "Chest-Supported Row":"وضع البداية: اضبط المقعد المائل بحيث يستند الصدر إلى الوسادة والقدمان ثابتتان. ابدأ والذراعان ممدودتان براحة. اسحب المقبضين نحو جانبي القفص الصدري مع توجيه المرفقين للخلف، وازفر، ثم أعدهما ببطء. لا تهز الجذع أو ترفع الصدر عن الوسادة ولا ترفع الكتفين نحو الأذنين.",
 "Lat Pulldown":"وضع البداية: اجلس وثبّت الفخذين تحت الوسادة، وامسك البار أوسع قليلاً من الكتفين. ارفع الصدر بلطف واسحب البار نحو أعلى الصدر مع توجيه المرفقين للأسفل، وازفر. أعد البار للأعلى بتحكم مع شهيق. لا تسحبه خلف الرقبة ولا تتأرجح للخلف ولا ترفع الكتفين بعنف.",
 "Band Face Pull":"وضع البداية: ثبّت المطاط الطويل عند مستوى الوجه إلى نقطة تثبيت قوية وآمنة، وامسك الطرفين. التنفيذ: اسحب المطاط نحو الوجه مع فتح اليدين للخارج وتوجيه المرفقين للخلف، ثم ارجع ببطء. استخدم مقاومة خفيفة وازفر أثناء السحب. الأخطاء: رفع الكتفين، تقويس الظهر، أو سحب المطاط بقوة عالية. توقف إذا ظهر ألم في الكتف.",
 "Band External Rotation":"وضع البداية: ثبّت المطاط الطويل على جانبك عند مستوى المرفق، وقف بحيث تكون اليد القريبة من نقطة التثبيت ممسكة بالمطاط، والمرفق مثنياً 90 درجة ومثبتاً بجانب الجسم. لف الساعد للخارج بمدى مريح ثم عد ببطء. ازفر أثناء الدوران. لا تحرك المرفق أو الجذع ولا تستخدم مقاومة ثقيلة. الهدف تنشيط عضلات الكتف المدورة للخارج.",
 "Aerobic Fitness Progression":"اختر دراجة ثابتة أو Elliptical أو مشياً سريعاً. الأسابيع 1–4: 15–20 دقيقة عند RPE 3–4؛ تستطيع التحدث بجمل. الأسابيع 5–8: إحماء 5 دقائق ثم 4 جولات × دقيقتين عند RPE 6، وبينها دقيقتان سهلة، ثم تهدئة. الأسابيع 9–11: مجموعتان من 5 جولات، 15 ثانية سريعة مضبوطة و45 ثانية سهلة، مع 3 دقائق بين المجموعتين؛ على الدراجة أو الملعب إذا كان التعافي مناسباً. الأسبوع 12 خفّض الحجم. احذف هذه الجرعة إذا احتوى تدريب الأهلي على مباريات أو جري متقطع قوي. لا تحوّلها إلى اختبار أقصى.",
 "Foam Roller Recovery":"استخدم الرول على عضلات الفخذ الأمامية والسمانة والألوية وأعلى الظهر فقط بضغط مريح. تحرك ببطء 30–45 ثانية لكل منطقة، وتوقف أو خفف الضغط عند ألم أو خدر. لا تتدحرج مباشرة فوق المفاصل أو عظام الركبة والكاحل أو العمود الفقري وأسفل الظهر، ولا تستخدمه فوق إصابة أو كدمة. تنفس طبيعياً. الرول قد يساعد على تخفيف الإحساس بالتيبس مؤقتاً، لكنه ليس علاجاً للإصابة ولا بديلاً عن النوم والتعافي.",
 "Easy Mobility":"اختر حركات لطيفة لمدة 5 دقائق: تدوير الكاحل، Ankle Rocks، فتح الورك، Open Book وحركات كتف خفيفة. تحرك ببطء ضمن مدى مريح دون دفع المفصل لنهاية الحركة. تنفس بشكل طبيعي. لا تستخدم ارتداداً سريعاً ولا تحاول زيادة المدى بالقوة. الهدف تقليل التيبس والحفاظ على الحركة في يوم الراحة أو بعد التدريب.",
 "Weekly Review Notes":"هذا نشاط مراجعة وليس تمريناً بدنياً. بعد نهاية الأسبوع اكتب: 1) أفضل شيء نجح في الاستلام أو الحركة، 2) أكثر خطأ تكرر، 3) مستوى التعب العام، 4) سؤال واحد للمدرب. استخدم أمثلة فعلية من التدريب ولا تحكم على نفسك من مباراة واحدة فقط. اختر نقطة واحدة للعمل عليها في الأسبوع التالي.",
 "Partner Hand-Target Reception":"مع زميل أو مدرب: قف بوضعية استعداد على بعد 3–5 أمتار. يعرض الممرر يديه كهدف واضح ويمرر 5 كرات مريحة نحو الصدر أو اليدين. تحرك خطوة صغيرة لمقابلة الكرة، جهّز اليدين مبكراً واستقبل بكلتا اليدين، ثم ثبّت الكرة قبل إعادتها. ابدأ دون مدافع. لا تطلب تمريرات صعبة قبل إتقان الاستلام النظيف.",
 "Partner Low-Ball Reception":"مع زميل أو مدرب: يمرر الشريك كرات منخفضة إلى مستوى الركبة أو أسفلها ضمن مدى يمكن الوصول إليه. اخفض الجسم بثني الوركين والركبتين، وحرك القدمين لتصبح خلف مسار الكرة، ثم استقبل بكلتا اليدين واسحبها نحو الجسم. ازفر بهدوء ولا تحبس النفس. لا تنحنِ من الظهر وحده ولا تحاول التقاط كرات بعيدة جداً بمد الذراع فقط. زد الصعوبة تدريجياً.",
 "Shadow Defender Timing":"يؤدي المدافع دوراً ظلياً دون دفع أو مسك. ابدأ في وضع Pivot، راقب الكرة والمدافع، غيّر زاويتك بخطوات صغيرة لتظهر كهدف، ثم انتظر التوقيت المناسب لطلب الكرة. الممرر يختار لحظة التمرير. ركّز على الحركة قبل وصول الكرة لا على الاشتباك. خفف الضغط إذا أثر على التقنية. هذا تمرين مع شريك وإشراف مدرب وليس تمريناً منفرداً.",
 "Pivot Movement: Block → Reposition":"داخل تدريب الفريق وتحت إشراف المدرب: اختر موقعاً قانونياً بين المدافع والكرة، ثبت قاعدة القدمين والجذع دون دفع أو مسك أو مد الذراعين لإعاقة المنافس. عندما تتحرك الكرة أو يتغير موقع المدافع، أعد التموضع بخطوات قصيرة إلى زاوية تمرير جديدة وأظهر يديك. نفّذ 3×4 مواقف بجودة عالية. الهدف فتح مساحة للفريق ثم الاستعداد للاستلام.",
 "Catch → Protect → Turn":"مع زميل أو مدرب: استقبل الكرة بكلتا اليدين أولاً وثبّتها قرب الجذع. اجعل جسمك بين المدافع والكرة دون دفع أو مسك، وحافظ على توازن القدمين. بعد السيطرة، اختر تمريراً أو دوراناً قصيراً مع احترام قدم الارتكاز وقواعد الخطوات، ثم مرر أو صوّب. لا تبدأ الدوران قبل ثبات الكرة ولا تلف الركبة المثبتة بعنف. ابدأ دون مدافع ثم زد الضغط بإشراف.",
 "6m Pivot Finishing":"مع حارس ومدرب إن أمكن: ابدأ من منطقة الدائرة خارج خط المنطقة، تحرك لفتح زاوية تمرير، استقبل الكرة وثبّتها ثم أنهِ من مسافة 6 أمتار وفق الموقف وقواعد اللعب. نفّذ 2×4 محاولات مع راحة كافية، وابدأ بدقة وقوة متوسطة لا أقصى قوة. سجل هل كان التصويب على الهدف وهل حافظت على التوازن. لا تكرر القفز أو الدوران إذا ظهر ألم أو تعب يغير التقنية."
});


Object.assign(EXPLAIN,{
 "Solo Pivot Footwork Around Cone":"ضع مخروطاً على الأرض ليكون علامة مكان المدافع، وقف على مسافة آمنة منه بوضعية Pivot. تحرك حوله بخطوات جانبية قصيرة، وافتح زاوية تمرير ثم غيّر اتجاهك وعد إلى وضع الاستعداد. نفّذ 3×15 ثانية مع راحة 30–40 ثانية. لا تلمس المخروط ولا تحاول دفعه أو محاكاة احتكاك قوي. حافظ على الركبتين باتجاه أصابع القدمين والجذع متوازناً.",
 "Solo Shadow Block + Reposition":"استخدم مخروطاً أو علامة أرضية كموقع افتراضي للمدافع. قف بجانبه واتخذ وضعية بلوك قانونية: قدمان ثابتتان، قاعدة متوازنة، الذراعان ضمن حدود جسمك. اثبت لحظة، ثم تحرك بخطوتين قصيرتين إلى زاوية أخرى كأنك تعيد التموضع لتصبح هدفاً للتمرير. نفّذ 2×4 لكل جهة. لا تدفع المخروط ولا تمد الذراعين لإعاقة شخص؛ هذا تدريب حركة وظلي فقط.",
 "Wall Catch → Pivot Turn":"قف على بعد 3–4 أمتار من الحائط. مرر الكرة بزاوية بحيث ترتد نحو جانبك، تحرك لمقابلة الكرة واستقبلها بكلتا اليدين، ثبّتها قرب الجذع، ثم نفّذ دوران Pivot قصيراً ومتوازناً مع احترام قدم الارتكاز وقواعد الخطوات. أعد الكرة للحائط. نفّذ 2×5، وابدأ ببطء قبل زيادة السرعة.",
 "Solo 6m Target Finishing":"ضع هدفاً كبيراً محدداً داخل المرمى (زاوية أو مساحة مرسومة) وابدأ من مسافة آمنة مناسبة قرب خط 6 أمتار مع الالتزام بعدم دخول منطقة المرمى. نفّذ حركة اقتراب قصيرة، جهّز الكرة وصوّب بقوة 60–70% نحو الهدف. نفّذ 2×4 مع راحة كافية وسجّل الإصابات الصحيحة. لا تقفز إذا لم تكن الأرضية مناسبة أو إذا شعرت بألم. هذا يطوّر الدقة والميكانيكية لكنه لا يعوض التصويب أمام حارس."
});


Object.assign(EXPLAIN,{"Dynamic Warm-up":"ابدأ بمشي أو هرولة سهلة، ثم حرّك الذراعين والكتفين والوركين والكاحلين وأضف خطوات جانبية. ارفع سرعة الحركة تدريجيًا ولا تبدأ بسبرنت أو قفز قوي.","Band External Rotation":"ثبّت الرباط عند مستوى المرفق، واجعل المرفق مثنيًا 90 درجة بجانب الجسم. لف الساعد للخارج بمدى مريح ثم عد ببطء، دون تحريك المرفق أو الجذع.","Lateral Band Walks":"ضع رباطًا فوق الركبتين، اثنِ الوركين قليلًا وخذ خطوات جانبية قصيرة مع بقاء الشد في الرباط. حافظ على الركبتين بمحاذاة القدمين.","Single Leg Balance (Eyes Closed)":"قف قرب حائط وارفع قدمًا مع ثني بسيط لركبة الرجل الداعمة. ابدأ والعينان مفتوحتان، ولا تغلقهما إلا إذا كنت ثابتًا وتحت إشراف؛ افتحهما فور فقدان السيطرة.","Jump on Fit-Box":"استخدم صندوقًا ثابتًا ومنخفضًا. اقفز بكلتا القدمين واهبط بهدوء مع ثني الركبتين، وثبّت وضعك قبل النزول خطوة خطوة. لا تستخدم صندوقًا مرتفعًا.","Depth Jump to Hurdle Hop":"تمرين متقدم وتحت إشراف مدرب فقط. انزل من منصة منخفضة، امتص الهبوط بثني الوركين والركبتين، ثم اقفز فوق حاجز منخفض. توقف إذا فقدت السيطرة.","Full Squat":"قف بعرض الكتفين، انزل بثني الوركين والركبتين ضمن مدى مريح مع بقاء الكعبين على الأرض، ثم ادفع الأرض للوقوف. استخدم إشراف مدرب وحافظ على 2–3 تكرارات احتياطية.","Dumbbell Walking Lunges":"أمسك دمبلين خفيفين أو استخدم وزن الجسم. خذ خطوة أمامية وانزل مع محاذاة الركبة للقدم، ثم ادفع الأرض وانتقل للخطوة التالية دون ميل الجذع.","Lever Lying Leg Curl":"استلقِ على الجهاز واضبط الوسادة خلف الكاحلين. اثنِ الركبتين لسحب الوسادة دون رفع الحوض، ثم أعد الساقين ببطء.","Eccentric Calf Raise":"قف قرب دعامة، ارفع الكعبين ثم انزل على رجل واحدة ببطء خلال أربع ثوانٍ. بدّل الرجل وحافظ على الكاحل مستقيمًا.","KAS Glute Bridge":"استلقِ مع ثني الركبتين والقدمين قرب الوركين. ارفع الحوض بشد الأرداف وركز على الجزء العلوي من الحركة دون تقويس أسفل الظهر.","Cable Pallof Press":"قف بجانب كابل عند مستوى الصدر، ادفع اليدين للأمام وقاوم سحب الكابل الذي يحاول تدوير الجذع. أعد اليدين وبدّل الجهة مع ثبات الحوض.","Lever Seated Hip Adduction":"اجلس على الجهاز وضع الفخذين على الوسائد. قرّب الفخذين باتجاه بعضهما بتحكم ثم ارجع ببطء. استخدم مدى مريحًا دون ألم في الورك أو المغبن.","Power Sled Push":"أمسك مقابض الزلاجة ومل للأمام مع ظهر محايد. ادفع بخطوات قصيرة وقوية، واختر حملاً يسمح بالحركة دون انهيار التقنية.","Shadow Throw — Without Ball":"قف بوضعية التصويب من دون كرة. ابدأ بتدوير الورك والجذع ثم الكتف ومد الذراع وأنهِ بثني الرسغ. نفّذ ببطء ولا تستخدم مقاومة ثقيلة.","Standing Throw 50–60%":"قف باتجاه هدف آمن. ابدأ الحركة من القدمين والورك ثم الجذع والكتف والرسغ. صوّب بقوة 50–60% مع التركيز على الدقة وأوقف التصويب عند الألم.","Standing Throw 60–70%":"نفّذ التصويب من الوقوف بتسلسل القدمين والورك والجذع والكتف والرسغ. استهدف منطقة محددة بقوة 60–70% مع توازن جيد.","Zone 2 Cardio":"اختر الدراجة أو المشي السريع. حافظ على جهد يسمح لك بالتحدث بجملة كاملة دون لهاث. ابدأ بسهولة ولا تحوّل الجلسة لاختبار أقصى.","Foam Roller Recovery":"مرر الرول بضغط مريح على عضلات الفخذ والسمانة والألوية وأعلى الظهر. تجنب المفاصل والعظام وتوقف عند الألم أو الخدر.","Monster Walk":"ضع رباطًا حول الفخذين أو الكاحلين. اثنِ الوركين والركبتين قليلًا وخذ خطوات قصيرة جانبية أو أمامية وخلفية مع استمرار شد الرباط.","A-March + Ankle Rotation":"امشِ برفع الركبة إلى مستوى مريح مع أصابع قدم مرفوعة وحركة الذراع المقابلة. تقدم بخطوات قصيرة وأضف دورانًا هادئًا للكاحل.","Sprint 20m":"ابدأ من وضع ثابت مع ميل بسيط للجذع. ادفع الأرض للخلف في أولى الخطوات، حرّك الذراعين، وسرّع حتى 20 مترًا ثم خفف تدريجيًا.","Pro Agility 5-10-5":"ضع ثلاثة أقماع على خط واحد. انطلق من الأوسط 5م إلى جهة، ثم 10م إلى الجهة الأخرى، ثم 5م للوسط. اخفض مركز الجسم قبل تغيير الاتجاه.","Deceleration Stop Drill":"انطلق 5م بسرعة مضبوطة ثم خفف الخطوات وتوقف خلال 2–3 خطوات متوازنة. اثنِ الوركين والركبتين ولا تغرس القدم أو تلتف على ركبة ثابتة.","Lateral Shuffle Squat Tap":"تحرك جانبيًا بخطوات قصيرة دون تقاطع القدمين. عند العلامة انزل نصف سكوات والمس علامة منخفضة ثم ارجع مع ثبات الجذع.","ZigZag Hops":"اقفز بخفة بين علامات متعرجة مع هبوط ناعم ومتزن. ابدأ بمسافات صغيرة وتوقف إذا فقدت السيطرة على الهبوط.","Broad Jump to Vertical":"اقفز للأمام من وضع نصف سكوات واهبط بهدوء، ثم نفّذ قفزة عمودية منخفضة. اثبت عند الهبوط ولا تكرر مع فقدان التوازن.","Tennis Ball Wall Reaction":"قف أمام الحائط وارمِ كرة التنس بزاوية غير متوقعة. تابعها بعينيك والتقط ارتدادها، وغيّر الارتفاع والاتجاه مع تحكم بالكتف والرسغ.","Visual Cue Lateral Shuffle":"قف بوضعية رياضية واستخدم إشارة بصرية يمينًا أو يسارًا. تحرك فورًا بخطوات جانبية قصيرة ثم توقف متوازنًا دون تقاطع القدمين.","Repeated Sprint 10m + Stop + 10m":"انطلق 10م، توقف أو امشِ لخمس ثوانٍ، ثم انطلق 10م أخرى. خذ الراحة المحددة وحافظ على جودة السرعة.","Hollow Rock":"استلقِ على ظهرك وشد البطن مع إبقاء أسفل الظهر على الأرض. ارفع الذراعين والساقين بمدى متحكم فيه ونفّذ تأرجحًا صغيرًا دون تقويس الظهر.","Mobility & Stretching":"نفّذ حركات لطيفة للكاحل والورك والكتف وأعلى الظهر. تحرك ببطء ضمن مدى مريح دون ارتداد أو ألم.","Ankle Rocks + 90/90 Hip":"ادفع الركبة للأمام فوق أصابع القدم مع بقاء الكعب على الأرض. ثم اجلس بوضع 90/90 وبدّل اتجاه الوركين ببطء دون إجبار المفصل.","Band Pull-Aparts":"أمسك رباطًا خفيفًا أمام الصدر واسحب اليدين للخارج مع ضم لوحي الكتف دون رفعهما للأذنين، ثم ارجع ببطء.","Band Face Pull":"ثبّت الرباط عند مستوى الوجه واسحب الطرفين نحو الوجه مع فتح اليدين للخارج والمرفقين للخلف. استخدم مقاومة خفيفة.","Medicine Ball Chest Throw":"أمسك كرة طبية خفيفة أمام الصدر وقف بثبات. ادفع الكرة للأمام بسرعة من الصدر مع بقاء الجذع مستقرًا واستخدم جدارًا آمنًا.","Plyo Push-Up":"ابدأ بوضعية الضغط والجذع مستقيم. انزل بتحكم ثم ادفع الأرض بقوة واهبط بهدوء. استخدم ضغطًا عاديًا إذا لم تستطع الهبوط بثبات.","Dumbbell Incline Bench Press":"اضبط المقعد بزاوية مائلة وثبّت القدمين والظهر. ادفع الدمبلين للأعلى دون قفل المرفقين ثم أنزلهما ببطء مع رسغين مستقيمين.","Lat Pulldown":"اجلس وثبّت الفخذين واسحب البار نحو أعلى الصدر مع توجيه المرفقين للأسفل. أعده ببطء ولا تسحبه خلف الرقبة.","One Arm Seated Row":"اجلس بثبات واسحب مقبض الكابل بيد واحدة نحو جانب الجذع. أعد الذراع ببطء دون لف الجذع أو رفع الكتف.","Shoulder Press":"امسك الدمبلين عند مستوى الكتف وادفعهما للأعلى ضمن مدى مريح ثم أنزلهما بتحكم. لا تقوس أسفل الظهر وتوقف عند الألم.","Cable Face Pull":"ثبّت الحبل عند مستوى الوجه واسحبه باتجاه الوجه مع فتح اليدين للخارج والمرفقين للخلف. ارجع ببطء وأبقِ الكتفين منخفضين.","Farmer's Carry":"أمسك وزنًا مناسبًا في كل يد وامشِ 30م بخطوات ثابتة. حافظ على الجذع مستقيمًا والرسغين محايدين، وضع الأوزان بتحكم.","Dead Hang":"أمسك عارضة ثابتة ودع الجسم يتدلى مع تحكم الكتفين والتنفس. لا تتأرجح وانزل قبل فقدان القبضة. أوقف التمرين عند ألم الكتف.","Captains Chair Leg Raise":"ضع الساعدين على مسندي الجهاز وارفع الركبتين نحو الصدر مع شد البطن ودون تأرجح، ثم أنزلهما ببطء.","Glute Bridge with Band":"استلقِ مع ثني الركبتين ورباط فوقهما. ارفع الحوض بدفع الكعبين وفتح الركبتين قليلًا، ثم انزل بتحكم.","Jump Box Over":"استخدم صندوقًا منخفضًا وثابتًا. اقفز فوقه أو إلى جانبه حسب توجيه المدرب، واهبط بثني الوركين والركبتين في مساحة آمنة.","Lateral Cone Hop":"ضع مخروطًا صغيرًا واقفز جانبيًا فوقه بخطوات قصيرة. اهبط بهدوء وثبّت الجسم قبل التكرار.","Skater Hops":"اقفز جانبيًا من رجل إلى أخرى. اهبط مع ثني الورك والركبة وحافظ على الركبة فوق القدم، واثبت قبل القفزة التالية.","Romanian Deadlift":"ادفع الوركين للخلف مع ثني بسيط للركبتين وأنزل الأوزان قرب الساقين مع ظهر محايد. توقف عند شد خلف الفخذ ثم قف بتحكم.","Walking Lunges":"خذ خطوة أمامية وانزل مع محاذاة الركبة للقدم، ثم ادفع الأرض وانتقل للخطوة التالية مع جذع متوازن.","Nordic Hamstring Curl":"ثبّت الكاحلين تحت دعامة مبطنة وبمساعدة مدرب. من الركوع انحنِ للأمام ببطء بمقاومة خلف الفخذ، والتقط نفسك باليدين. ابدأ بثلاث تكرارات فقط.","Leg Curl":"اضبط الوسادة خلف الكاحل واثنِ الركبتين لسحبها، ثم أعدها ببطء مع بقاء الحوض ثابتًا.","Standing Calf Raise":"قف على سطح ثابت وارفع الكعبين لأعلى مدى مريح، اثبت ثم انزل ببطء مع استقامة الكاحلين.","Side Plank":"ضع المرفق تحت الكتف وارفع الحوض حتى يصبح الجسم بخط مستقيم. تنفس بهدوء، واستخدم الركبتين كنسخة أسهل.","Band Hip Abduction":"ضع رباطًا حول الفخذين أو الكاحلين وحرّك الرجل للخارج ببطء دون ميل الحوض، ثم عد بتحكم.","Static Stretching":"اثبت في تمطيط لطيف للفخذ والورك والسمانة والكتف لمدة 20–30 ثانية، دون ارتداد أو ضغط للألم.","Solo Pivot Footwork Around Cone":"ضع مخروطًا كعلامة للمدافع وتحرك حوله بخطوات جانبية قصيرة وافتح زاوية تمرير. لا تحاكي احتكاكًا قويًا وحدك.","Wall Lateral Step + Catch":"مرر الكرة إلى الحائط بزاوية تجعلها ترتد جانبًا، تحرك بخطوة أو خطوتين لتصبح أمام مسارها ثم استقبلها بكلتا اليدين وثبّتها.","Catch → Protect → Pivot Turn":"استقبل الكرة بكلتا اليدين وثبّتها قرب الجذع. احمها بجسمك دون دفع، ثم نفذ دورانًا قصيرًا مع احترام قدم الارتكاز.","Reception Under Fatigue":"اركض 20م ثم اتجه للحائط واستقبل ارتداد الكرة بكلتا اليدين. ثبّتها قرب الصدر قبل إعادة التمرير، وزد الصعوبة فقط إذا بقي الاستلام نظيفًا.","Target Throw":"حدد هدفًا في المرمى ووجّه التصويب نحوه مع التركيز على الدقة قبل القوة. زد الشدة تدريجيًا وأوقف التمرين عند ألم الكتف أو المرفق.","Step-in Throw 70–75%":"خذ خطوة قصيرة بالقدم المعاكسة لذراع التصويب وانقل الوزن للأمام، ثم دوّر الورك والجذع وأطلق الكرة بقوة 70–75% نحو هدف.","Pivot Move & Shoot":"تحرك حول مخروط وافتح زاوية استقبال، استلم الكرة وثبّتها ثم نفذ دورانًا متوازنًا وصوّب نحو هدف محدد.","Shoot under Fatigue":"اركض 15م بسرعة مضبوطة ثم استلم وصوّب فورًا بقوة 75–80%. خذ راحة كافية وأوقف المجموعة إذا تدهورت الدقة.","Easy Walk (Optional)":"امشِ 15–20 دقيقة بخطوات مريحة تسمح لك بالتحدث بسهولة. لا تضف جريًا في يوم الراحة.","Sleep 8–9 Hours":"هذا تذكير بالتعافي وليس تمرينًا. حافظ على وقت نوم منتظم وأعطِ جسمك وقتًا كافيًا للنمو والتعافي."});
