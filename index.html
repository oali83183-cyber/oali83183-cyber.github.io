<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>علي — التمرين والتغذية 🏐</title>
<style>
:root{--bg:#0e0e10;--card:#1c1c20;--card2:#25252c;--line:#2f2f37;--txt:#f5f5f7;--sub:#9aa0a6;--ok:#1fd07c;--accent:#e11d2d;--gold:#ffdf6b;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,Tahoma,sans-serif;font-size:16px;line-height:1.6;}
.app{max-width:680px;margin:0 auto;padding:10px 10px 90px;}
.top{position:sticky;top:0;z-index:20;background:rgba(14,14,16,.96);backdrop-filter:blur(8px);padding:8px 0 10px;}
.top .day{font-size:21px;font-weight:900;}
.top .date{color:var(--sub);font-size:13px;}
.tabs{display:flex;gap:7px;overflow-x:auto;overscroll-behavior-x:contain;scrollbar-width:none;position:sticky;top:66px;z-index:19;background:rgba(14,14,16,.98);padding:7px 0;white-space:nowrap;}
.tabs::-webkit-scrollbar{display:none;}
.tab{flex:0 0 auto;border:none;border-radius:12px;padding:10px 13px;font-size:12.5px;font-weight:900;cursor:pointer;font-family:inherit;background:var(--card);border:1px solid var(--line);color:var(--sub);white-space:nowrap;}
.tab.active{background:var(--accent);color:#fff;border-color:var(--accent);}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:10px;}
.card h2{margin:0 0 6px;font-size:16px;}
.muted{color:var(--sub);font-size:12px;}
.ex{display:flex;align-items:center;gap:9px;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:11px 10px;margin-bottom:7px;min-height:50px;}
.ex input{width:21px;height:21px;accent-color:var(--ok);flex-shrink:0;}
.ex .nm{flex:1;font-weight:700;font-size:14px;}
.ex .st{color:var(--gold);font-weight:800;white-space:nowrap;font-size:12px;}
.ex.done{opacity:.5;}.ex.done .nm{text-decoration:line-through;}
.vidrow{margin:3px 0 9px 22px;}
.vbtn{border:none;color:#fff;border-radius:8px;padding:6px 11px;font-size:11.5px;font-weight:700;cursor:pointer;font-family:inherit;background:#e11d2d;text-decoration:none;display:inline-block;}
.pbar{height:8px;background:var(--card2);border-radius:99px;overflow:hidden;margin-top:5px;}
.pbar div{height:100%;background:var(--ok);border-radius:99px;transition:width .3s;}
.plabel{font-size:12px;color:var(--sub);text-align:center;margin-top:3px;}
.note{background:#1e1a0a;border:1px solid #6b5900;color:var(--gold);border-radius:10px;padding:8px 10px;font-size:11.5px;margin-bottom:10px;}
.soft-note{background:#151923;border:1px solid #263348;color:#cbd5e1;border-radius:11px;padding:9px 10px;font-size:12px;margin-bottom:9px;}
.section-title{margin:12px 0 6px;font-size:13.5px;font-weight:900;color:var(--gold);}
.exbox{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 10px;margin-bottom:8px;}
.exname{background:transparent;border:none;color:var(--txt);text-align:right;cursor:pointer;padding:0;font-family:inherit;font-weight:700;font-size:14px;}
.exname:after{content:" 💡";opacity:.6;}
.exinfo{font-size:12.5px;color:var(--sub);background:var(--card2);border:1px dashed var(--line);border-radius:8px;padding:8px 10px;margin:6px 0;line-height:1.7;display:none;}
.exinfo b{color:var(--gold);}
.exhelp-btn{display:block;width:100%;margin:6px 0 2px;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:#202a38;color:#dbeafe;font:700 12.5px system-ui,Tahoma,sans-serif;text-align:right;cursor:pointer;}
.bigbtn{display:block;width:100%;border:none;border-radius:13px;padding:13px;font-size:14.5px;font-weight:900;cursor:pointer;font-family:inherit;background:var(--accent);color:#fff;min-height:48px;}
.bigbtn.green{background:var(--ok);color:#06210f;}
.dev-card{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px;}
.dev-card h3{margin:0 0 5px;font-size:14px;}
.weekly-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin-top:9px;}
.weekly-grid .tf{background:var(--card2);border:1px solid var(--line);border-radius:9px;padding:7px;}
.weekly-grid label{display:block;font-size:10px;color:var(--sub);margin-bottom:4px;font-weight:800;}
.weekly-grid input,.weekly-grid textarea{width:100%;box-sizing:border-box;background:var(--card);border:1px solid var(--line);color:var(--txt);border-radius:7px;padding:7px;font-family:inherit;}
.weekly-grid textarea{min-height:64px;resize:vertical;}
.weekly-wide{grid-column:1/-1;}
.weekly-status{font-size:11px;color:var(--ok);margin-top:7px;text-align:center;font-weight:800;}
.train-day-nav{display:flex;gap:6px;overflow-x:auto;padding:8px 0 5px;scrollbar-width:thin;margin-bottom:6px;}
.train-day-btn{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--sub);border-radius:10px;padding:9px 12px;font:800 12px system-ui,Tahoma,sans-serif;cursor:pointer;}
.train-day-btn.active{background:var(--accent);border-color:var(--accent);color:#fff;}
.matchitem{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:9px;margin:6px 0;font-size:12px;}
.settingrow{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px;}
.settingrow input[type=checkbox]{width:22px;height:22px;accent-color:var(--ok);}
.settingrow input[type=date]{background:var(--card);color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:7px;}
.modehint{font-size:11px;color:var(--gold);margin-top:6px;}
.cue{font-size:17px;font-weight:900;text-align:center;padding:10px;background:var(--card2);border:1px solid var(--line);border-radius:11px;margin:7px 0;color:var(--gold);}
.plan-intro{border-color:#71313a;background:linear-gradient(145deg,#241416,#1c1c20);}
/* Food styles */
.foodcard{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px;}
.foodcard b{font-size:16px;color:var(--ok);}
.foodcard .sub{font-size:12px;color:var(--sub);margin-top:4px;}
.meal{display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);}
.meal:last-child{border-bottom:none;}
.meal time{font-size:11px;color:var(--sub);min-width:70px;flex-shrink:0;padding-top:2px;}
.meal div{flex:1;}
.meal b{font-size:13px;}
.protein{font-size:12px;color:var(--ok);font-weight:800;white-space:nowrap;}
.meal-box{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:4px 12px;margin-bottom:10px;}
/* PreCamp styles */
.pc-phase{background:var(--card2);border:1px solid var(--line);border-radius:12px;margin-bottom:10px;overflow:hidden;}
.pc-phase-head{padding:12px 14px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);}
.pc-phase-num{width:30px;height:30px;border-radius:50%;background:var(--ok);color:#06130a;font-weight:900;font-size:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.pc-phase-body{padding:12px 14px;}
.pc-phase-goal{font-size:12px;color:var(--ok);font-weight:700;margin-bottom:8px;}
.pc-phase-list{list-style:none;padding:0;margin:0;}
.pc-phase-list li{font-size:12.5px;color:var(--sub);padding:3px 0;display:flex;gap:8px;}
.pc-phase-list li::before{content:'→';color:var(--ok);flex-shrink:0;}
.pc-stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px;}
.pc-stat{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center;}
.pc-stat b{display:block;font-size:18px;color:var(--ok);}
.pc-stat span{font-size:10px;color:var(--sub);}
.pc-stat b.y{color:var(--gold);}
.shoot-row{display:flex;align-items:center;gap:10px;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:7px;}
.shoot-wk{font-size:11px;color:var(--ok);font-weight:700;min-width:90px;flex-shrink:0;}
.shoot-pct{font-size:12px;color:var(--gold);font-weight:700;white-space:nowrap;}
.fit-card{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:11px;margin-bottom:8px;}
.fit-wk{font-size:11px;color:var(--gold);font-weight:700;margin-bottom:4px;}
.track-tbl{width:100%;border-collapse:collapse;font-size:12px;}
.track-tbl th{text-align:right;padding:7px 8px;color:var(--sub);font-size:10px;font-weight:700;background:var(--card2);border-bottom:1px solid var(--line);}
.track-tbl td{padding:7px 8px;border-bottom:1px solid var(--line);color:var(--txt);}
.track-tbl tr:last-child td{border-bottom:none;}
.t-now{color:var(--ok);font-weight:700;}
.t-blank{color:#3d5c42;font-style:italic;}
.pc-rule{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:11px;margin-bottom:7px;display:flex;gap:10px;}
.pc-rule-ic{font-size:18px;flex-shrink:0;}
.pc-rule-title{font-weight:700;font-size:13px;margin-bottom:3px;}
.pc-rule-desc{font-size:11.5px;color:var(--sub);line-height:1.5;}
.supp-tbl{width:100%;border-collapse:collapse;font-size:12.5px;}
.supp-tbl th{text-align:right;padding:8px 10px;color:var(--sub);font-size:10px;font-weight:700;background:var(--card2);border-bottom:1px solid var(--line);}
.supp-tbl td{padding:8px 10px;border-bottom:1px solid var(--line);color:var(--txt);}
.supp-tbl tr:last-child td{border-bottom:none;}
.warn-card{background:#1f1200;border:1px solid #4a3000;border-radius:12px;padding:12px;margin-bottom:10px;}
.warn-card ul{margin:6px 0 0 0;padding-right:16px;}
.warn-card li{font-size:12.5px;color:var(--sub);padding:3px 0;line-height:1.6;}
@media(max-width:520px){
  .tabs{gap:6px;}.tab{font-size:12px;padding:9px 11px;}
  .weekly-grid{grid-template-columns:1fr;}.weekly-wide{grid-column:auto;}
  .pc-stat-row{grid-template-columns:repeat(2,1fr);}
}
</style>
</head>
<body>
<div class="app">
<div class="top">
  <div class="day" id="dayTitle">📅</div>
  <div class="date" id="dateSub"></div>
</div>
<div class="tabs" aria-label="أقسام البرنامج">
  <button class="tab active" id="tabTrain" onclick="showTab('train')">🏋️ التمارين</button>
  <button class="tab" id="tabFood" onclick="showTab('food')">🍽️ التغذية</button>
</div>
<div id="trainDayNav" class="train-day-nav"></div>
<div id="trainBox"></div>
<div id="foodBox" style="display:none;"></div>
</div>

function todayKey(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function fmtDate(d){return d.getDate()+" "+AR_MONTHS[d.getMonth()]+" "+d.getFullYear();}
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

/* EXPLAIN */
var EXPLAIN={"Dynamic Warm-up":"ابدأ بمشي أو هرولة سهلة ثم حرّك الذراعين والكتفين والوركين والكاحلين وأضف خطوات جانبية. ارفع سرعة الحركة تدريجيًا ولا تبدأ بسبرنت أو قفز قوي. الهدف رفع حرارة الجسم وتجهيز المفاصل.","Lateral Band Walks":"ضع رباطًا فوق الركبتين واثنِ الوركين قليلًا. خذ خطوات جانبية قصيرة مع بقاء الشد في الرباط والركبتين باتجاه أصابع القدمين.","Single Leg Balance (Eyes Closed)":"قف قرب حائط وارفع قدمًا مع ثني بسيط للركبة. ابدأ والعينان مفتوحتان ولا تغلقهما إلا إذا كنت ثابتًا. لاستشعار موضع الجسم — Proprioception.","Jump on Fit-Box":"استخدم صندوقًا ثابتًا ومنخفضًا. اقفز بكلتا القدمين واهبط بهدوء مع ثني الوركين والركبتين. ثبّت وضعك قبل النزول.","Depth Jump to Hurdle Hop":"تمرين متقدم وتحت إشراف مدرب فقط. انزل من منصة منخفضة وامتص الهبوط بثني الوركين والركبتين ثم اقفز فوق حاجز منخفض.","Full Squat":"قف بعرض الكتفين وانزل مع بقاء الكعبين على الأرض والجذع مستقيم. RIR 2–3 دائمًا — لا تصل للفشل.","Dumbbell Walking Lunges":"خذ خطوة أمامية وانزل مع محاذاة الركبة للقدم ثم ادفع الأرض وانتقل للخطوة التالية. ظهر مستقيم دون ميل.","Lever Lying Leg Curl":"استلقِ على الجهاز وثنِ الركبتين لسحب الوسادة دون رفع الحوض ثم أعدهما ببطء.","Eccentric Calf Raise":"ارفع الكعبين برجلين ثم انزل على رجل واحدة ببطء خلال أربع ثوانٍ. يقوي الكاحل ويحمي من الإصابة.","KAS Glute Bridge":"استلقِ مع ثني الركبتين والقدمين قرب الوركين. ارفع الحوض بشد الأرداف مع ثبات أسفل الظهر.","Cable Pallof Press":"قف جانبيًا للكابل وادفع اليدين للأمام دون أن يدور الجذع. لثبات الجذع وحماية الظهر.","Lever Seated Hip Adduction":"اجلس على الجهاز وقرّب الفخذين باتجاه بعضهما ببطء ثم أعدهما. يحمي الأربطة ويقوي داخل الفخذ.","Power Sled Push":"أمسك مقابض الزلاجة ومل للأمام بظهر محايد. ادفع بخطوات قصيرة وقوية.","Shadow Throw — Without Ball":"قف بوضعية التصويب. ابدأ من الحوض والجذع ثم الكتف والمرفق وأنهِ بحركة الرسغ. الهدف تعلم الميكانيكية وليس السرعة.","Standing Throw 50–60%":"قف باتجاه هدف آمن وصوّب بقوة 50–60%. الهدف الإحساس بالكرة والإيقاع. لا تضغط نحو القوة القصوى.","Zone 2 Cardio":"دراجة أو مشي سريع. تستطيع التحدث بجملة كاملة دون لهاث. نبض تقريبي 125–145.","Foam Roller Recovery":"مرر الرول بضغط مريح على الفخذين والسمانة والألوية وأعلى الظهر. 30–45 ثانية لكل منطقة. لا تتدحرج فوق المفاصل.","Monster Walk":"ضع رباطًا حول الفخذين أو الكاحلين واثنِ الوركين قليلًا. خطوات أمامية وخلفية وجانبية مع استمرار شد الرباط.","Sprint 20m":"ابدأ بميل خفيف للجذع وادفع الأرض للخلف في أولى الخطوات. راحة كاملة بين كل محاولة للحفاظ على الجودة.","Pro Agility 5-10-5":"ثلاثة أقماع. انطلق من الأوسط 5م ثم 10م للجهة الأخرى ثم 5م للوسط. اخفض مركز الجسم قبل تغيير الاتجاه.","Deceleration Stop Drill":"انطلق 5م بسرعة 70–80% ثم خفف الخطوات وتوقف في 2–3 خطوات متوازنة. لا تغرس القدم أو تلتف على ركبة ثابتة.","Lateral Shuffle Squat Tap":"تحرك جانبيًا بخطوات قصيرة. عند العلامة انزل نصف سكوات والمس الأرض ثم ارجع مع ثبات الجذع.","ZigZag Hops":"اقفز بخفة بين علامات متعرجة مع هبوط ناعم ومتزن. ابدأ بمسافات صغيرة.","Broad Jump to Vertical":"اقفز للأمام واهبط بهدوء ثم نفّذ قفزة عمودية منخفضة. اثبت عند الهبوط قبل التكرار.","Tennis Ball Wall Reaction":"ارمِ كرة التنس على الحائط بزاوية غير متوقعة والتقط ارتدادها. غيّر الارتفاع والاتجاه. يطور رد الفعل.","Visual Cue Lateral Shuffle":"قف بوضعية رياضية واستجب لإشارة بصرية بتحرك جانبي فوري. ثم توقف متوازنًا.","Repeated Sprint 10m + Stop + 10m":"انطلق 10م توقف 5 ثوانٍ ثم انطلق 10م. يحاكي شدة لعب الدائرة وBack Left.","Hollow Rock":"استلقِ وشد البطن مع إبقاء أسفل الظهر على الأرض. ارفع الذراعين والساقين ونفّذ تأرجحًا صغيرًا.","Mobility & Stretching":"حركات لطيفة للكاحل والورك والكتف وأعلى الظهر. تحرك ضمن مدى مريح دون ارتداد أو ألم.","Band External Rotation":"ثبّت الرباط عند مستوى المرفق. المرفق 90 درجة بجانب الجسم. لف الساعد للخارج بمدى مريح. يحمي الكتف من الإصابة.","Ankle Rocks + 90/90 Hip":"ادفع الركبة للأمام فوق أصابع القدم مع بقاء الكعب على الأرض. ثم اجلس 90/90 وبدّل اتجاه الوركين ببطء.","Band Pull-Aparts":"أمسك رباطًا أمام الصدر واسحب اليدين للخارج مع ضم لوحي الكتف دون رفعهما. لتفعيل الكتف الخلفي.","Band Face Pull":"ثبّت الرباط عند مستوى الوجه واسحبه باتجاه الوجه مع فتح اليدين والمرفقين للخلف. مقاومة خفيفة جداً.","Medicine Ball Chest Throw":"أمسك كرة طبية خفيفة أمام الصدر وادفعها للأمام بسرعة من الصدر. استخدم جدارًا آمنًا.","Plyo Push-Up":"انزل بتحكم ثم ادفع الأرض بقوة. اهبط بهدوء. ابدأ بضغط عادي إذا لم تستطع الهبوط بثبات.","Dumbbell Incline Bench Press":"زاوية مائلة. ادفع الدمبلين للأعلى دون قفل المرفقين ثم أنزلهما ببطء.","Lat Pulldown":"اجلس وثبّت الفخذين واسحب البار نحو أعلى الصدر مع توجيه المرفقين للأسفل. لا تسحبه خلف الرقبة.","One Arm Seated Row":"اسحب مقبض الكابل بيد واحدة نحو جانب الجذع. أعد الذراع ببطء دون لف الجذع.","Shoulder Press":"ادفع الدمبلين للأعلى ضمن مدى مريح. لا تقوس أسفل الظهر.","Cable Face Pull":"ثبّت الحبل عند مستوى الوجه واسحبه باتجاه الوجه مع فتح اليدين والمرفقين للخلف. لصحة الكتف.","Farmer's Carry":"أمسك وزنًا مناسبًا وامشِ 30م بخطوات ثابتة. ظهر مستقيم ورسغان محايدان. يقوي القبضة والجذع.","Dead Hang":"أمسك عارضة ثابتة ودع الجسم يتدلى. تنفس بانتظام. يقوي القبضة ويفتح الكتف.","Captains Chair Leg Raise":"ارفع الركبتين نحو الصدر مع شد البطن دون تأرجح ثم أنزلهما ببطء.","Standing Throw 60–70%":"ابدأ من الحوض والجذع ثم الكتف والرسغ. صوّب نحو هدف محدد بقوة 60–70%. الدقة قبل القوة.","Target Throw":"حدد هدفًا في المرمى ووجّه التصويب نحوه. سجّل عدد الإصابات. زد القوة تدريجيًا.","Step-in Throw 70–75%":"خطوة اقتراب قصيرة بالقدم المعاكسة ثم دوران الورك والجذع وتسريع الذراع بقوة 70–75%.","Pivot Move & Shoot":"تحرك حول مخروط وافتح زاوية استلام. استلم الكرة وثبّتها ثم نفذ دورانًا وصوّب نحو هدف.","Glute Bridge with Band":"استلقِ مع رباط فوق الركبتين. ارفع الحوض بشد الأرداف وفتح الركبتين قليلًا. لتفعيل الأرداف.","Jump Box Over":"استخدم صندوقًا منخفضًا ثابتًا. اقفز فوقه واهبط بثني الوركين والركبتين في مساحة آمنة.","Lateral Cone Hop":"اقفز جانبيًا فوق مخروط صغير. اهبط بهدوء وثبّت الجسم قبل التكرار.","Skater Hops":"اقفز جانبيًا من رجل إلى أخرى. اهبط مع ثني الورك والركبة. اثبت قبل القفزة التالية.","Romanian Deadlift":"ادفع الوركين للخلف مع ثني بسيط للركبتين وانزل الأوزان قرب الساقين مع ظهر محايد.","Walking Lunges":"خطوة أمامية وانزل مع محاذاة الركبة للقدم ثم انتقل للخطوة التالية.","Nordic Hamstring Curl":"ثبّت الكاحلين تحت دعامة وانحنِ للأمام ببطء بمقاومة خلف الفخذ. ابدأ بثلاث تكرارات فقط. الأهم لحماية الركبة.","Leg Curl":"استلقِ واثنِ الركبتين لسحب الوسادة. أعدها ببطء مع بقاء الحوض ثابتًا.","Standing Calf Raise":"ارفع الكعبين لأعلى مدى مريح واثبت ثم انزل ببطء.","Side Plank":"ضع المرفق تحت الكتف وارفع الحوض حتى يصبح الجسم بخط مستقيم. تنفس بهدوء.","Band Hip Abduction":"ضع رباطًا حول الفخذين وحرّك الرجل للخارج ببطء دون ميل الحوض. لثبات الركبة.","Static Stretching":"اثبت في تمطيط لطيف 20–30 ثانية لكل منطقة. لا ارتداد. للفخذ والورك والسمانة والكتف.","Sleep 8–9 Hours":"التعافي والنمو يحصلان في النوم. 6 ساعات = نصف تمرين. غير قابل للتفاوض.","Easy Walk (Optional)":"مشي مريح 15–20 دقيقة. يوم راحة ولا تضف جريًا.","Solo Pivot Footwork Around Cone":"ضع مخروطًا كمدافع وتحرك حوله بخطوات جانبية قصيرة. افتح زاوية تمرير ثم عد لوضع الاستعداد.","Wall Lateral Step + Catch":"مرر الكرة للحائط بزاوية جانبية. تحرك بخطوة لمقابلة الارتداد واستقبل بكلتا اليدين.","Catch → Protect → Pivot Turn":"استقبل الكرة وثبّتها قرب الجذع. احمها بجسمك دون دفع ثم نفّذ دوران Pivot قصيرًا.","Reception Under Fatigue":"اركض 20م ثم اتجه للحائط واستقبل الكرة فورًا. يحاكي ظروف المباراة الحقيقية.","Shoot under Fatigue":"اركض 15م بسرعة مضبوطة ثم صوّب فورًا بقوة 75–80%. يحاكي إنهاء الهجمة بعد مجهود."};

var selectedTrainingDay=(new Date()).getDay();

function vidRow(name){
  var q=VID[name]||(name+" exercise tutorial");
  var wrap=document.createElement("div");wrap.className="vidrow";
  var a=document.createElement("a");a.className="vbtn";a.href="https://www.youtube.com/results?search_query="+encodeURIComponent(q);a.target="_blank";a.rel="noopener";a.textContent="▶ شاهد على YouTube";
  wrap.appendChild(a);return wrap;
}

function showTab(t){
  ["train","food","precamp","report","schedule","library"].forEach(function(x){
    var cap=x.charAt(0).toUpperCase()+x.slice(1);
    var btn=document.getElementById("tab"+cap),box=document.getElementById(x+"Box");
    if(btn)btn.classList.toggle("active",x===t);
    if(box)box.style.display=x===t?"block":"none";
  });
  var nav=document.getElementById("trainDayNav");
  if(nav)nav.style.display=t==="train"?"flex":"none";
  window.scrollTo({top:0,behavior:"smooth"});
}

function renderTrain(){
  var now=new Date(),di=selectedTrainingDay,s=SCHED[di],box=document.getElementById("trainBox"),nav=document.getElementById("trainDayNav");
  if(!box||!nav||!s)return;
  nav.innerHTML="";
  SCHED.forEach(function(d,i){
    var b=document.createElement("button");b.type="button";b.className="train-day-btn"+(i===di?" active":"");
    b.textContent=d.day+(i===now.getDay()?" ·اليوم":"");
    b.onclick=function(){selectedTrainingDay=i;renderTrain();};
    nav.appendChild(b);
  });
  var dt=new Date(now.getFullYear(),now.getMonth(),now.getDate()-now.getDay()+di);
  var key=dt.getFullYear()+"-"+String(dt.getMonth()+1).padStart(2,"0")+"-"+String(dt.getDate()).padStart(2,"0");
  document.getElementById("dayTitle").textContent=s.day+" — "+s.title;
  document.getElementById("dateSub").textContent=fmtDate(dt)+" · "+s.cal;
  box.innerHTML="";
  if(s.note){var nd=document.createElement("div");nd.className="note";nd.textContent=s.note;box.appendChild(nd);}
  var total=0;(s.am||[]).forEach(function(g){total+=g.ex.length;});
  var arr=(DB.am[key]||[]).slice(0,total),idx=0;
  var card=document.createElement("div");card.className="card";
  card.innerHTML="<h2>🏐 "+esc(s.day)+" — "+esc(s.title)+"</h2><div class='muted'>اضغط على اسم التمرين لقراءة الشرح · زر YouTube للمشاهدة</div>";
  (s.am||[]).forEach(function(grp){
    var gh=document.createElement("div");gh.className="section-title";gh.textContent=grp.cat;card.appendChild(gh);
    grp.ex.forEach(function(item){
      var n=idx++,nm=item[0],st=[item[1],item[2]].filter(function(v){return v&&v!=="—";}).join(" · ");
      var wrap=document.createElement("div");wrap.className="exbox";
      var row=document.createElement("div");row.className="ex";
      var cb=document.createElement("input");cb.type="checkbox";cb.checked=!!arr[n];
      cb.onchange=function(){arr[n]=cb.checked;DB.am[key]=arr;saveDB();row.classList.toggle("done",cb.checked);upd();};
      if(cb.checked)row.classList.add("done");
      var nameBtn=document.createElement("button");nameBtn.type="button";nameBtn.className="nm exname";nameBtn.textContent=nm;
      var stEl=document.createElement("span");stEl.className="st";stEl.textContent=st;
      row.appendChild(cb);row.appendChild(nameBtn);row.appendChild(stEl);wrap.appendChild(row);
      var info=document.createElement("div");info.className="exinfo";
      info.innerHTML="<b>📌 طريقة الأداء:</b> "+esc(EXPLAIN[nm]||"نفّذ الحركة بتحكم وتنفس طبيعي. توقف عند الألم.")+"<br><b>⚠️ تنبيه:</b> RIR 2–3 دائمًا — لا تصل للفشل العضلي.";
      var helpBtn=document.createElement("button");helpBtn.type="button";helpBtn.className="exhelp-btn";helpBtn.textContent="📖 اضغط لقراءة شرح التمرين";
      function toggle(){var open=info.style.display!=="block";info.style.display=open?"block":"none";helpBtn.textContent=open?"✖ إخفاء الشرح":"📖 اضغط لقراءة شرح التمرين";}
      helpBtn.onclick=toggle;nameBtn.onclick=toggle;
      wrap.appendChild(helpBtn);wrap.appendChild(info);wrap.appendChild(vidRow(nm));
      card.appendChild(wrap);
    });
  });
  var bar=document.createElement("div");bar.className="pbar";var fill=document.createElement("div");bar.appendChild(fill);card.appendChild(bar);
  var lbl=document.createElement("div");lbl.className="plabel";card.appendChild(lbl);
  box.appendChild(card);
  function upd(){var done=arr.filter(Boolean).length;fill.style.width=(total?done/total*100:0)+"%";lbl.textContent="أنجزت "+done+" من "+total+" تمرينًا";}upd();
}

  "<div class='dev-card'><h3>SC Magdeburg — راقب Saugstrup</h3>التمركز · البلوك · التحرك قبل التمريرة · الإنهاء.<br><a href='https://ehftv.com/' target='_blank' style='color:#60a5fa'>EHFTV ↗</a></div>"+
  "<div class='dev-card'><h3>Denmark vs France — قارن Saugstrup وFabregas</h3><a href='https://www.youtube.com/results?search_query=Denmark+France+handball+Saugstrup+pivot' target='_blank' style='color:#60a5fa'>ابحث على YouTube ↗</a></div></div>"+
  "<div class='card'><h2>🔎 طريقة المشاهدة</h2><div class='cue'>أوقف الفيديو قبل التمريرة — توقّع حركة Pivot — شغّل اللقطة — قارن</div>"+
  "<div class='dev-card'><b>Positioning:</b> أين يقف قبل التمريرة؟</div>"+
  "<div class='dev-card'><b>Receiving:</b> كيف يجهز يديه وجسمه؟</div>"+
  "<div class='dev-card'><b>Footwork:</b> كيف يغيّر زاويته قبل وصول الكرة؟</div>"+
  "<div class='dev-card'><b>Finishing:</b> كيف ينهي من زوايا مختلفة؟</div></div>"+
  "<div class='card'><h2>📝 سجل تحليل المباراة</h2>"+
  "<div class='weekly-grid'>"+
  "<div class='tf'><label>المباراة</label><input id='filmMatch' placeholder='Barça vs Füchse'></div>"+
  "<div class='tf'><label>اللاعب</label><input id='filmPlayer' placeholder='Saugstrup'></div>"+
  "<div class='tf'><label>تاريخ المشاهدة</label><input id='filmDate' type='date'></div>"+
  "<div class='tf'><label>المدة (دقيقة)</label><input id='filmMin' type='number' min='1'></div>"+
  "<div class='tf weekly-wide'><label>ماذا لاحظت في تحركه؟</label><textarea id='filmMove'></textarea></div>"+
  "<div class='tf weekly-wide'><label>ماذا ستطبق في تدريبك؟</label><textarea id='filmApply'></textarea></div>"+
  "</div><button class='bigbtn' id='saveFilm'>💾 حفظ التحليل</button><div id='filmStatus' class='weekly-status'></div><div id='filmHistory'></div></div>";

  if(!DB.library)DB.library={films:[]};
  var fd=DB.library.draft||{};
  ["filmMatch","filmPlayer","filmDate","filmMin","filmMove","filmApply"].forEach(function(id){var el=document.getElementById(id);if(el)el.value=fd[id]||(id==="filmDate"?todayKey():"");});
  document.getElementById("saveFilm").onclick=function(){
    var item={};["filmMatch","filmPlayer","filmDate","filmMin","filmMove","filmApply"].forEach(function(id){item[id]=(document.getElementById(id)||{}).value||"";});
    if(!item.filmMatch&&!item.filmMove){document.getElementById("filmStatus").textContent="أضف اسم المباراة أو ملاحظة.";return;}
    DB.library.films.unshift(item);DB.library.draft={};saveDB();
    document.getElementById("filmStatus").textContent="✅ تم حفظ التحليل.";
    var h=document.getElementById("filmHistory");if(!h)return;
    h.innerHTML="<h3 style='margin:12px 0 6px;font-size:14px'>التحليلات السابقة</h3>";
    DB.library.films.slice(0,5).forEach(function(f){h.innerHTML+="<div class='dev-card'><b>"+esc(f.filmDate||"")+"</b> — "+esc(f.filmMatch||"")+(f.filmPlayer?" · "+esc(f.filmPlayer):"")+"<br><span style='color:var(--sub);font-size:12px'>"+esc(f.filmMove||"")+"</span><br><b>التطبيق:</b> "+esc(f.filmApply||"")+"</div>";});
  };
  var h2=document.getElementById("filmHistory");if(h2&&DB.library.films.length){h2.innerHTML="<h3 style='margin:12px 0 6px;font-size:14px'>التحليلات السابقة</h3>";DB.library.films.slice(0,5).forEach(function(f){h2.innerHTML+="<div class='dev-card'><b>"+esc(f.filmDate||"")+"</b> — "+esc(f.filmMatch||"")+"<br><span style='color:var(--sub);font-size:12px'>"+esc(f.filmMove||"")+"</span></div>";});}
}
