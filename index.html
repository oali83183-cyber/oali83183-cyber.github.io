<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>برنامج علي اليومي 🏆</title>
<style>
  :root{
    --bg:#0f172a; --card:#1e293b; --card2:#273449; --line:#334155;
    --txt:#f1f5f9; --sub:#94a3b8; --accent:#f59e0b; --accent2:#fb923c;
    --ok:#22c55e; --bad:#ef4444; --info:#38bdf8;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--txt);
    font-family:"Segoe UI",Tahoma,"Noto Kufi Arabic",system-ui,sans-serif;
    font-size:17px; line-height:1.6; padding-bottom:90px;
  }
  header{
    position:sticky; top:0; z-index:50; background:linear-gradient(180deg,#0b1224,#0f172a);
    border-bottom:1px solid var(--line); padding:14px 16px 10px;
  }
  .topline{display:flex; align-items:center; justify-content:space-between; gap:8px;}
  .logo{font-size:20px; font-weight:800;}
  .logo span{color:var(--accent);}
  .datechip{
    background:var(--card); border:1px solid var(--line); border-radius:999px;
    padding:6px 14px; font-size:14px; color:var(--sub); white-space:nowrap;
  }
  .weekline{margin-top:8px; font-size:14px; color:var(--sub); display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:6px;}
  .weekpill{background:var(--accent); color:#0f172a; font-weight:800; border-radius:999px; padding:3px 12px; font-size:13px;}
  nav{
    display:flex; gap:6px; margin-top:12px; overflow-x:auto; padding-bottom:4px;
  }
  nav button{
    flex:1; min-width:76px; border:1px solid var(--line); background:var(--card);
    color:var(--sub); border-radius:12px; padding:10px 4px; font-size:13.5px; font-weight:700;
    cursor:pointer; font-family:inherit;
  }
  nav button.active{background:var(--accent); color:#0f172a; border-color:var(--accent);}
  main{max-width:640px; margin:0 auto; padding:16px;}
  .card{
    background:var(--card); border:1px solid var(--line); border-radius:18px;
    padding:16px; margin-bottom:14px;
  }
  .card h2{margin:0 0 10px; font-size:19px; display:flex; align-items:center; gap:8px;}
  .card h3{margin:14px 0 8px; font-size:16px; color:var(--accent2);}
  .muted{color:var(--sub); font-size:14.5px;}
  .big{font-size:20px; font-weight:800;}
  .session-emoji{font-size:30px;}
  .session-title{font-size:20px; font-weight:800; margin:2px 0 4px;}
  .tag{display:inline-block; background:var(--card2); border:1px solid var(--line); border-radius:999px; padding:2px 10px; font-size:12.5px; color:var(--sub); margin:2px;}
  .ex{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    background:var(--card2); border:1px solid var(--line); border-radius:12px;
    padding:11px 12px; margin-bottom:8px;
  }
  .ex input[type=checkbox]{width:24px; height:24px; accent-color:var(--ok); flex-shrink:0;}
  .ex .exname{flex:1; font-weight:700;}
  .ex .exx{color:var(--accent); font-weight:800; white-space:nowrap;}
  .ex.done{opacity:.55;} .ex.done .exname{text-decoration:line-through;}
  .ex .exlink{cursor:pointer;}
  .ex .hint{opacity:.75; font-size:13px;}
  .exbody{display:none; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:10px 12px; margin:-4px 0 10px; font-size:14.5px; color:var(--sub);}
  .exbody p{margin:5px 0;}
  .exbody b{color:var(--accent2);}
  .ytlink{display:inline-block; margin-top:8px; background:#e11d48; color:#fff; border:none; border-radius:8px; padding:7px 14px; font-size:13.5px; font-weight:700; cursor:pointer; font-family:inherit;}
  .vidgroup{display:flex; gap:6px; flex-wrap:wrap; margin-top:8px;}
  .vbtn{border:none; color:#fff; border-radius:8px; padding:7px 13px; font-size:13px; font-weight:700; cursor:pointer; font-family:inherit;}
  .langbtn{background:var(--card); border:1px solid var(--line); color:var(--sub); border-radius:999px; padding:6px 12px; font-size:13px; font-weight:700; cursor:pointer; font-family:inherit; white-space:nowrap;}
  .timerwrap{text-align:center;}
  .timerbig{font-size:52px; font-weight:900; color:var(--accent); font-family:monospace; direction:ltr; margin:10px 0;}
  .timerbtns{display:flex; gap:8px; flex-wrap:wrap; justify-content:center;}
  .timerbtns button{background:var(--card2); border:1px solid var(--line); color:var(--txt); border-radius:10px; padding:12px 14px; font-size:15px; font-weight:800; cursor:pointer; font-family:inherit; flex:1; min-width:70px;}
  .timerbtns button.act{background:var(--accent); color:#0f172a; border-color:var(--accent);}
  .badges{display:flex; flex-wrap:wrap; gap:8px;}
  .badge{background:var(--card2); border:1px solid var(--line); border-radius:12px; padding:10px 12px; font-size:13px; display:flex; align-items:center; gap:8px;}
  .badge.earned{background:rgba(34,197,94,.12); border-color:rgba(34,197,94,.4);}
  .badge .ico{font-size:20px;}
  .goalbar{margin-bottom:14px;}
  .goalbar .lbl{display:flex; justify-content:space-between; font-size:14px; margin-bottom:4px;}
  .mealrow{display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid var(--line);}
  .mealrow .mtime{font-weight:800; min-width:130px; font-size:13.5px;}
  .mealrow .mfood{flex:1; color:var(--sub); font-size:14px;}
  .mealrow.done .mfood{text-decoration:line-through; opacity:.55;}
  .chips{display:flex; flex-wrap:wrap; gap:6px;}
  .chip{background:var(--card2); border:1px solid var(--line); border-radius:999px; padding:5px 11px; font-size:13px;}
  .progressbar{height:8px; background:var(--card2); border-radius:99px; overflow:hidden; margin:8px 0 2px;}
  .progressbar div{height:100%; background:var(--ok); border-radius:99px; transition:width .3s;}
  .btn{
    display:block; width:100%; border:none; border-radius:14px; padding:15px;
    font-size:17px; font-weight:800; cursor:pointer; font-family:inherit; text-align:center;
  }
  .btn-accent{background:var(--accent); color:#0f172a;}
  .btn-ok{background:var(--ok); color:#06210f;}
  .btn-info{background:var(--info); color:#062a38;}
  .btn-line{background:transparent; color:var(--txt); border:1px solid var(--line);}
  .btn.big{font-size:19px; padding:17px;}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .field{margin-bottom:14px;}
  .field label{display:block; font-size:15px; font-weight:700; margin-bottom:6px; color:var(--sub);}
  .field input[type=text], .field input[type=number], .field select, .field textarea{
    width:100%; background:var(--card2); border:1px solid var(--line); color:var(--txt);
    border-radius:12px; padding:13px; font-size:17px; font-family:inherit;
  }
  .field textarea{min-height:80px; resize:vertical;}
  .scale{display:flex; gap:5px; flex-wrap:wrap;}
  .scale button{
    flex:1; min-width:44px; background:var(--card2); border:1px solid var(--line); color:var(--txt);
    border-radius:10px; padding:10px 6px; font-size:16px; font-weight:800; cursor:pointer; font-family:inherit;
  }
  .scale button.sel{background:var(--accent); color:#0f172a; border-color:var(--accent);}
  .notebox{
    background:var(--card2); border:1px dashed var(--line); border-radius:12px; padding:10px 12px;
    font-size:14px; color:var(--sub); margin-bottom:10px;
  }
  .toast{
    position:fixed; bottom:100px; left:50%; transform:translateX(-50%);
    background:var(--ok); color:#06210f; font-weight:800; padding:12px 22px; border-radius:99px;
    font-size:15px; box-shadow:0 8px 24px rgba(0,0,0,.4); opacity:0; pointer-events:none;
    transition:opacity .25s; z-index:100; white-space:nowrap;
  }
  .toast.show{opacity:1;}
  .logrow{display:flex; justify-content:space-between; align-items:center; gap:8px; padding:10px 0; border-bottom:1px solid var(--line);}
  .logrow .date{font-weight:800; font-size:15px;}
  .logrow .vals{color:var(--sub); font-size:13.5px; text-align:left;}
  .mini{font-size:12.5px; color:var(--sub);}
  .ltr{direction:ltr; unicode-bidi:embed;}
  .cent{text-align:center;}
  table{width:100%; border-collapse:collapse; font-size:14.5px;}
  th,td{border:1px solid var(--line); padding:8px 6px; text-align:center;}
  th{background:var(--card2); color:var(--accent);}
  .banner{border-radius:14px; padding:12px; margin-bottom:14px; font-size:15px; font-weight:700;}
  .banner.warn{background:rgba(239,68,68,.15); border:1px solid rgba(239,68,68,.4); color:#fca5a5;}
  .banner.info{background:rgba(56,189,248,.12); border:1px solid rgba(56,189,248,.35); color:#7dd3fc;}
  .banner.gold{background:rgba(245,158,11,.14); border:1px solid rgba(245,158,11,.4); color:#fcd34d;}
  .textarea-copy{width:100%; min-height:140px; background:var(--card2); border:1px solid var(--line); color:var(--txt); border-radius:12px; padding:12px; font-size:14px; font-family:inherit; direction:rtl;}
  details{background:var(--card2); border:1px solid var(--line); border-radius:12px; padding:10px 12px; margin-bottom:8px;}
  summary{cursor:pointer; font-weight:700; color:var(--txt);}
  details p{margin:8px 0 0; color:var(--sub); font-size:14.5px;}
  .phase{border-right:4px solid var(--accent); padding:4px 10px 4px 0; margin:6px 0;}
</style>
</head>
<body>

<header>
  <div class="topline">
    <div class="logo">🏆 <span>برنامج علي</span> — Pivot</div>
    <div class="datechip" id="dateChip"></div>
    <button id="langBtn" class="langbtn" onclick="setSearchLang(searchLang==='ar'?'en':'ar')">🌐 English</button>
  </div>
  <div class="weekline">
    <span id="weekInfo"></span>
    <span class="weekpill" id="weekPill"></span>
  </div>
  <nav>
    <button data-v="home" class="active">🏋️ اليوم</button>
    <button data-v="day">⏰ يومي الكامل</button>
    <button data-v="receive">🎯 الاستلام</button>
    <button data-v="food">🍽️ التغذية</button>
    <button data-v="strength">📈 القوة</button>
    <button data-v="lib">📖 الشروحات</button>
    <button data-v="checkin">📝 تسجيل اليوم</button>
    <button data-v="log">📖 السجل</button>
    <button data-v="progress">📊 التقدم</button>
    <button data-v="send">📤 إرسال للمدرب</button>
  </nav>
</header>

<main id="main"></main>

<div class="toast" id="toast">تم الحفظ ✅</div>

var KEY = "ali_hb_db_v1";
function loadDB(){
  try{ return JSON.parse(localStorage.getItem(KEY)) || {entries:{}, done:{}}; }
  catch(e){ return {entries:{}, done:{}}; }
}
var DB = loadDB();
function saveDB(){
  try{ localStorage.setItem(KEY, JSON.stringify(DB)); }catch(e){}
}
function todayKey(){ return toKey(new Date()); }
function toKey(d){
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}

/* ================= منطق الخطة ================= */
function dayDiff(d){
  var a = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  var b = new Date(START.getFullYear(), START.getMonth(), START.getDate());
  return Math.round((a - b) / 86400000);
}
function getPlan(d){
  var diff = dayDiff(d);
  if (diff < 0){
    // السبت قبل الانطلاق (2026-08-01) = يوم مهارات استعداد
    if (diff === -1) return {status:"prep", week:0, dayIdx:6};
    return {status:"before", week:0, dayIdx:-1};
  }
  if (diff > TOTAL_WEEKS*7 - 1) return {status:"after", week:0, dayIdx:-1};
  var week = Math.floor(diff/7) + 1;
  var dayIdx = diff % 7;
  return {status:"active", week:week, dayIdx:dayIdx};
}
function sessionFor(dayIdx){ return SESSIONS[dayIdx]; }
function phaseFor(week){
  if (!week) return "";
  if (week<=2) return PHASES[0];
  if (week<=4) return PHASES[1];
  if (week<=6) return PHASES[2];
  return PHASES[3];
}

/* ================= أدوات واجهة ================= */
function $(id){ return document.getElementById(id); }
function el(tag, cls, html){
  var e = document.createElement(tag);
  if (cls) e.className = cls;
  if (html !== undefined) e.innerHTML = html;
  return e;
}
var main = $("main");
var toastTimer = null;
function toast(msg){
  var t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.classList.remove("show"); }, 2200);
}
function esc(s){
  return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

var AR_MONTHS = ["يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"];
function fmtDate(d){
  return d.getDate()+" "+AR_MONTHS[d.getMonth()]+" "+d.getFullYear();
}

function copyText(txt, okMsg){
  function fallback(){
    var ta = document.createElement("textarea");
    ta.value = txt; ta.style.position="fixed"; ta.style.opacity="0";
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand("copy"); toast(okMsg||"تم النسخ ✅"); }
    catch(e){ toast("انسخ النص يدوياً"); }
    document.body.removeChild(ta);
  }
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(function(){ toast(okMsg||"تم النسخ ✅"); },
      function(){ fallback(); });
  } else fallback();
}

function scaleBtns(container, current, cb){
  for (var i=1;i<=10;i++){
    (function(v){

        container.querySelectorAll("button").forEach(function(x){x.classList.remove("sel");});

    })(i);

function buildDaySummary(k){
  var e = DB.entries[k] || {};
  var p = getPlan(new Date());
  var d = new Date();
  var sName = (p.status==="active") ? sessionFor(p.dayIdx).title : "خارج البرنامج";
  var lines = [];
  lines.push("📅 يومي — "+toKey(d)+" ("+AR_DAYS[d.getDay()]+")");
  lines.push("🏋️ الجلسة: "+sName);
  lines.push("🏃 تدربت: "+(e.trained?"نعم":"لا"));
  lines.push("😴 النوم: "+(e.sleep?e.sleep+" ساعات":"—"));
  lines.push("⚡ الطاقة: "+(e.energy?e.energy+"/10":"—"));
  if (e.trained) lines.push("📈 جودة التمرين: "+(e.quality?e.quality+"/10":"—"));
  if (e.weight) lines.push("⚖️ الوزن: "+e.weight+" كجم"+(e.waist?" | الخصر: "+e.waist+" سم":""));
  lines.push("💊 الكرياتين: "+(e.creatine?"✅ أخذته":"❌ لم آخذه")+" | 💧 الماء: "+(e.water?e.water+" لتر":"—"));
  if (DB.receiving[todayKey()]) lines.push("🎯 الاستلام: "+DB.receiving[todayKey()].dropped+" من 10 أفلتت");
  if (e.notes) lines.push("📝 ملاحظات: "+e.notes);
  return lines.join("\n");
}

function buildAllSummary(){
  var keys = Object.keys(DB.entries).sort();
  var out = ["📋 كل ملاحظات علي ("+keys.length+" يوم)","============================="];
  keys.forEach(function(k){
    var e = DB.entries[k];
    out.push("• "+k+" — نوم: "+(e.sleep||"—")+" | طاقة: "+(e.energy||"—")+
      (e.trained?(" | جودة: "+(e.quality||"—")):" | (راحة)")+
      (e.weight?(" | وزن: "+e.weight):"")+
      (e.waist?(" | خصر: "+e.waist):"")+
      ((e.creatine!==undefined)?(" | كرياتين: "+(e.creatine?"✅":"❌")):"")+
      ((e.water)?(" | ماء: "+e.water+"ل"):"")+
      ((DB.receiving[k])?(" | استلام: "+DB.receiving[k].dropped+"/10 مفلته"):"")+
      (e.notes?(" | ملاحظات: "+e.notes):""));
  });
  return out.join("\n");
}

function weeklySummary(){
  var p = getPlan(new Date());
  var week = (p.status==="active") ? p.week : 1;
  var out = ["📊 ملخص الأسبوع "+week+" — علي", "==========================="];
  var ekeys = Object.keys(DB.entries).sort();
  var sleeps=[],energies=[],qualities=[],weights=[],waists=[],trainDays=0;
  ekeys.forEach(function(k){
    var e = DB.entries[k];
    if (e.sleep) sleeps.push(parseFloat(e.sleep));
    if (e.energy) energies.push(parseFloat(e.energy));
    if (e.quality) qualities.push(parseFloat(e.quality));
    if (e.weight) weights.push(e.weight);
    if (e.waist) waists.push(e.waist);
    if (e.trained) trainDays++;
  });
  var avg = function(a){ return a.length ? (a.reduce(function(x,y){return x+y;},0)/a.length).toFixed(1) : "—"; };
  out.push("🏃 أيام تدريب: "+trainDays);
  out.push("😴 متوسط النوم: "+avg(sleeps)+" س");
  out.push("⚡ متوسط الطاقة: "+avg(energies)+"/10");
  out.push("📈 متوسط جودة التمرين: "+avg(qualities)+"/10");
  if (weights.length) out.push("⚖️ آخر وزن: "+weights[weights.length-1]+" كجم"+(waists.length?(" | الخصر: "+waists[waists.length-1]+" سم"):""));
  var rk = Object.keys(DB.receiving).sort();
  if (rk.length) out.push("🎯 الاستلام آخر مرة: "+DB.receiving[rk[rk.length-1]].dropped+" من 10 مفلته");
  out.push("📝 ملاحظاتي: ");
  return out.join("\n");
}

function drawChart(cv, rows){
  var ctx = cv.getContext("2d");
  var wpts = rows.filter(function(r){ return r.w; }).map(function(r){ return {k:r.k, v:parseFloat(r.w)}; });
  if (wpts.length < 2) return;
  ctx.clearRect(0,0,cv.width,cv.height);
  var pad = 30;
  var W = cv.width, H = cv.height;
  var vals = wpts.map(function(p){return p.v;});
  var mn = Math.min.apply(null, vals) - 1;
  var mx = Math.max.apply(null, vals) + 1;
  function X(i){ return pad + (W-2*pad) * i / (wpts.length-1); }
  function Y(v){ return H - pad - (H-2*pad) * (v-mn) / (mx-mn); }
  ctx.strokeStyle = "#334155"; ctx.lineWidth = 1;
  for (var g=0; g<=4; g++){
    var yy = pad + (H-2*pad)*g/4;
    ctx.beginPath(); ctx.moveTo(pad,yy); ctx.lineTo(W-pad,yy); ctx.stroke();
  }
  ctx.strokeStyle = "#f59e0b"; ctx.lineWidth = 3;
  ctx.beginPath();
  wpts.forEach(function(p,i){
    var x = X(i), y = Y(p.v);
    if (i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
  });
  ctx.stroke();
  ctx.fillStyle = "#22c55e";
  wpts.forEach(function(p,i){
    ctx.beginPath(); ctx.arc(X(i), Y(p.v), 5, 0, Math.PI*2); ctx.fill();
  });
  ctx.fillStyle = "#f1f5f9"; ctx.font = "12px Tahoma";
  ctx.textAlign = "center";
  wpts.forEach(function(p,i){
    ctx.fillText(p.k.slice(5), X(i), H-8);
  });
}

function downloadData(){
  var payload = { player:"علي", generated:new Date().toISOString(), entries:DB.entries };
  var blob = new Blob([JSON.stringify(payload, null, 2)], {type:"application/json"});
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "ملاحظات_علي.json";
  document.body.appendChild(a); a.click();
  setTimeout(function(){ document.body.removeChild(a); }, 200);
  toast("تم تنزيل الملف ✅");
}

function renderStrength(){

var tmrInt = null, tmrLeft = 0;
function initTimer(){
  var disp = document.getElementById("tmr");
  var wrap = document.getElementById("tmrBtns");
  if (!disp || !wrap) return;
  wrap.innerHTML = "";
  [[30,"30 ث"],[60,"1 د"],[90,"1:30"],[120,"2 د"],[180,"3 د"]].forEach(function(b){
    var bt = el("button", "", b[1]);
    bt.onclick = function(){
      if (tmrInt) clearInterval(tmrInt);
      tmrLeft = b[0];
      disp.textContent = fmtT(tmrLeft);
      disp.style.color = "#f59e0b";
      tmrInt = setInterval(function(){
        tmrLeft--;
        if (tmrLeft <= 0){
          clearInterval(tmrInt); tmrInt = null;
          disp.textContent = "00:00";
          disp.style.color = "#22c55e";
          beep();
          toast("🔔 انتهت الراحة — هيا!");
        } else {
          disp.textContent = fmtT(tmrLeft);
          if (tmrLeft <= 10) disp.style.color = "#ef4444";
        }
      }, 1000);
    };
    wrap.appendChild(bt);
  });
  var st = el("button","","⏹️ إيقاف");
  st.onclick = function(){
    if (tmrInt) clearInterval(tmrInt);
    tmrInt = null; tmrLeft = 0;
    disp.textContent = "00:00";
  };
  wrap.appendChild(st);
}
function fmtT(s){
  var m = Math.floor(s/60), ss = s%60;
  return String(m).padStart(2,"0")+":"+String(ss).padStart(2,"0");
}
function beep(){
  try{
    var ctx = new (window.AudioContext||window.webkitAudioContext)();
    var o = ctx.createOscillator(), g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.frequency.value = 880; o.type="sine";
    g.gain.setValueAtTime(0.4, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+0.8);
    o.start(); o.stop(ctx.currentTime+0.8);
  }catch(e){}
}

function drawDropChart(cv, keys){
  var ctx = cv.getContext("2d");
  var vals = keys.map(function(k){ return DB.receiving[k].dropped; });
  if (vals.length < 1) return;
  ctx.clearRect(0,0,cv.width,cv.height);
  var pad=30, W=cv.width, H=cv.height;
  function X(i){ return pad + (W-2*pad)*(keys.length===1?0.5:(i/(keys.length-1))); }
  function Y(v){ return H-pad-(H-2*pad)*(v-0)/(10-0); }
  ctx.strokeStyle="#334155"; ctx.lineWidth=1;
  for (var g=0; g<=4; g++){ var yy=pad+(H-2*pad)*g/4; ctx.beginPath(); ctx.moveTo(pad,yy); ctx.lineTo(W-pad,yy); ctx.stroke(); }
  ctx.fillStyle="#94a3b8"; ctx.font="11px Tahoma"; ctx.textAlign="right";
  ctx.fillText("10", W-pad, pad+10); ctx.fillText("5", W-pad, H/2+4); ctx.fillText("0", W-pad, H-pad+4);
  ctx.strokeStyle="#e11d48"; ctx.lineWidth=3;
  ctx.beginPath();
  vals.forEach(function(v,i){ var x=X(i), y=Y(v); if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y); });
  ctx.stroke();
  ctx.fillStyle="#f59e0b";
  vals.forEach(function(v,i){ ctx.beginPath(); ctx.arc(X(i),Y(v),5,0,Math.PI*2); ctx.fill(); });
  ctx.fillStyle="#f1f5f9"; ctx.textAlign="center"; ctx.font="11px Tahoma";
  keys.forEach(function(k,i){ ctx.fillText(k.slice(5), X(i), H-10); });
}
